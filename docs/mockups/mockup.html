<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A2370">
<title>Trace &amp; Discover - room mockup</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1D1747; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: "Arial Rounded MT Bold", Arial, sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; overflow: hidden; background: #FFE3A3; touch-action: none; }
.hide { display: none !important; }
.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; pointer-events: none; }

#bg { z-index: 1; }
#drawBg { z-index: 1; background: radial-gradient(circle at 50% 40%, #3B2F8F, #1D1747); }
#home { z-index: 2; background: linear-gradient(#FFE3A3, #FFBE5C); }
#veil { z-index: 2; }
[data-mode=trace] #veil { background: rgba(255,255,255,.55); }
[data-mode=reward] #veil { background: rgba(255,255,255,.4); }
[data-mode=end] #veil { background: linear-gradient(rgba(29,23,71,.82), rgba(42,35,112,.62)); }
#warm { z-index: 2; background: radial-gradient(circle at 900px 230px, rgba(255,236,150,.9), rgba(255,236,150,0) 62%); opacity: 0; transition: opacity .8s; }
.lampOn #warm { opacity: 1; }

/* home cards */
.card { position: absolute; top: 150px; width: 480px; height: 340px; border-radius: 40px; background: #fff; box-shadow: 0 12px 0 rgba(0,0,0,.16); overflow: hidden; pointer-events: auto; cursor: pointer; }
.card:active { transform: translateY(6px); box-shadow: 0 6px 0 rgba(0,0,0,.16); }
.thumb { width: 480px; height: 240px; overflow: hidden; }
.thumb svg { transform: scale(.375); transform-origin: 0 0; display: block; }
.cardIcon { position: absolute; left: 198px; top: 200px; width: 84px; height: 84px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; }
.cardIcon svg { width: 58px; height: 58px; }

/* room objects */
#objLayer { z-index: 3; }
.obj { position: absolute; pointer-events: auto; cursor: pointer; animation: idle 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
.obj svg { display: block; width: 100%; height: auto; }
.obj.boing { animation: boing .65s ease; }
.obj.done { opacity: .2; filter: grayscale(1); pointer-events: none; animation: none; }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes boing { 0% { transform: scale(1); } 25% { transform: scale(1.18,.82); } 55% { transform: scale(.9,1.14) translateY(-34px); } 80% { transform: scale(1.06,.94); } 100% { transform: scale(1); } }

/* toy box / backpack */
#cont { position: absolute; z-index: 4; left: 1100px; top: 470px; width: 150px; }
#cont > svg { display: block; width: 150px; height: 150px; }
#cont .minis { position: absolute; left: -16px; bottom: 140px; width: 200px; display: flex; gap: 2px; align-items: flex-end; }
#cont .mini { width: 62px; }
#cont .mini svg { display: block; width: 100%; height: auto; }
#cont.wig { animation: wig .7s ease; }
@keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }

/* tracing board and the moving object */
#board { z-index: 4; }
#boardWrap { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; transition: transform .9s cubic-bezier(.3,.9,.3,1); }
#boardWrap.shrunk { transform: translate(0,70px) scale(.6); }
#objView { position: absolute; z-index: 5; pointer-events: none;
  transition: left .9s cubic-bezier(.3,.9,.3,1), top .9s cubic-bezier(.3,.9,.3,1), width .9s cubic-bezier(.3,.9,.3,1), opacity .4s; }
#objView svg { display: block; width: 100%; height: auto; }
#objView.look { animation: idle 3s ease-in-out infinite; }

/* reward animations, one per object */
.glow { transition: opacity .6s; transform-box: fill-box; transform-origin: center; }
.rw-lamp .glow { opacity: 1 !important; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes spin { to { transform: rotate(360deg); } }
.rw-fan .blades { animation: spin .55s linear infinite; }
.rw-teddy .arm { animation: wave .5s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-8deg); } to { transform: rotate(40deg); } }
.rw-ball .bounce { animation: hop .7s ease-in-out infinite; }
.rw-ball .shadow { transform-origin: 100px 226px; animation: shad .7s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-70px); } }
@keyframes shad { 50% { transform: scale(.6); opacity: .07; } }
.rw-eraser .wob { animation: rub .45s ease-in-out infinite alternate; }
@keyframes rub { from { transform: translateX(-14px) rotate(-4deg); } to { transform: translateX(14px) rotate(4deg); } }
.pop { opacity: 0; }
.rw-lunch .lid { animation: openlid 1.2s ease forwards; }
@keyframes openlid { to { transform: rotate(-72deg); } }
.rw-lunch .pop { animation: popup 1.6s .7s ease forwards; }
@keyframes popup { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(-58px); opacity: 1; } }
.rw-flag .cloth { animation: flutter .5s ease-in-out infinite alternate; }
@keyframes flutter { from { transform: skewY(-7deg); } to { transform: skewY(7deg); } }
.rw-chairs .chair { animation: chairhop .8s ease-in-out both; }
.rw-chairs .c1, .rw-chairs .c1 .num { animation-delay: .4s; }
.rw-chairs .c2, .rw-chairs .c2 .num { animation-delay: 1.2s; }
.rw-chairs .c3, .rw-chairs .c3 .num { animation-delay: 2s; }
.rw-chairs .c4, .rw-chairs .c4 .num { animation-delay: 2.8s; }
.rw-chairs .chair .num { animation: shownum .1s both; }
@keyframes chairhop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-36px) scale(1.08); } }
@keyframes shownum { to { opacity: 1; } }

#confetti { z-index: 6; overflow: hidden; }
#confetti i { position: absolute; top: -30px; width: 14px; height: 22px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(700px) rotate(600deg); } }

/* end of session */
#moon { position: absolute; z-index: 6; left: 1040px; top: 40px; }
#endUI { position: absolute; z-index: 6; left: 340px; top: 478px; width: 520px; height: 144px; border-radius: 36px; background: rgba(255,255,255,.93); display: flex; align-items: center; justify-content: center; pointer-events: none; }
#endPaper { display: flex; align-items: center; gap: 30px; }
#endPaper svg:first-child { width: 84px; height: 105px; }
#endPaper svg:last-child { width: 170px; height: 42px; transform: rotate(-18deg); }
#zz { position: absolute; z-index: 8; left: 690px; top: 330px; pointer-events: none; }
#zz i { position: absolute; border-radius: 50%; background: #fff; opacity: .7; animation: rise 3s ease-in infinite; }
#zz i:nth-child(1) { width: 16px; height: 16px; left: 0; animation-delay: 0s; }
#zz i:nth-child(2) { width: 22px; height: 22px; left: 26px; animation-delay: 1s; }
#zz i:nth-child(3) { width: 30px; height: 30px; left: 60px; animation-delay: 2s; }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } 30% { opacity: .75; } to { transform: translateY(-80px); opacity: 0; } }

/* ink and Jugnu */
#ink, #live { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; pointer-events: none; z-index: 7; }
#jug { position: absolute; z-index: 8; width: 120px; height: 120px; pointer-events: none; }
#jug .jb { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.sleepy #jug .jb { animation: none; transform: rotate(78deg) scale(.9); opacity: .85; }

/* buttons */
.btn { position: absolute; z-index: 9; width: 96px; height: 96px; border-radius: 50%; background: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
.btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
#bHome { left: 1160px; top: 24px; }
#bBack { left: 24px; top: 24px; }
#bSkip { left: 1160px; top: 24px; opacity: .3; }
#bBrush { left: 24px; top: 520px; }
#bClear { left: 1160px; top: 520px; }
#bReplay { left: 890px; top: 502px; }
#palette { position: absolute; z-index: 9; left: 306px; top: 540px; display: flex; gap: 18px; pointer-events: none; }
.sw { width: 80px; height: 80px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); cursor: pointer; pointer-events: auto; }
.sw.rb { background: conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red); }
.sw:active { transform: translateY(3px); }
</style>
</head>
<body>
<div id="stage" data-mode="home">
  <div id="bg" class="layer" data-modes="room trace reward end"></div>
  <div id="drawBg" class="layer" data-modes="draw"></div>
  <div id="home" class="layer" data-modes="home"></div>
  <div id="veil" class="layer" data-modes="trace reward end"></div>
  <div id="warm" class="layer"></div>
  <div id="objLayer" class="layer" data-modes="room"></div>
  <div id="board" class="layer" data-modes="trace reward"><div id="boardWrap"></div></div>
  <div id="objView" data-modes="trace reward"></div>
  <div id="cont" data-modes="room end"></div>
  <div id="moon" data-modes="end"></div>
  <div id="endUI" data-modes="end"><div id="endPaper"></div></div>
  <div id="zz" data-modes="end"><i></i><i></i><i></i></div>
  <div id="confetti" class="layer"></div>
  <canvas id="ink" data-modes="trace draw"></canvas>
  <canvas id="live" data-modes="trace draw"></canvas>
  <div id="jug"></div>
  <div id="palette" data-modes="draw"></div>
  <div class="btn" id="bHome" role="button" aria-label="Choose another room" data-modes="room"></div>
  <div class="btn" id="bBack" role="button" aria-label="Back" data-modes="trace draw"></div>
  <div class="btn" id="bSkip" role="button" aria-label="Parent: skip ahead" data-modes="trace"></div>
  <div class="btn" id="bBrush" role="button" aria-label="Free drawing" data-modes="room end"></div>
  <div class="btn" id="bClear" role="button" aria-label="Clear the drawing" data-modes="draw"></div>
  <div class="btn" id="bReplay" role="button" aria-label="Play again" data-modes="end"></div>
</div>
<script>
/* Art for the room mockup. Plain SVG strings, no external files. */
var NS = 'xmlns="http://www.w3.org/2000/svg"';

var DEFS = '<svg ' + NS + ' width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
  '<radialGradient id="gLamp"><stop offset="0" stop-color="#FFF3A8" stop-opacity=".95"/><stop offset=".55" stop-color="#FFE066" stop-opacity=".45"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient>' +
  '<radialGradient id="gJug"><stop offset="0" stop-color="#FFE066" stop-opacity=".9"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient>' +
  '</defs></svg>';

function dotsFill(color, opacity, maxY) {
  var s = '';
  for (var y = 30; y < maxY; y += 60) {
    for (var x = (((y - 30) / 60) % 2 ? 60 : 30); x < 1280; x += 60) {
      s += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="' + color + '" opacity="' + opacity + '"/>';
    }
  }
  return s;
}

function bunting() {
  var cols = ['#FF6B6B', '#FFD43B', '#4D96FF', '#35D07F', '#FF8FD6'];
  var s = '<path d="M0 12 Q640 108 1280 12" stroke="#7A4E2D" stroke-width="4" fill="none"/>';
  for (var i = 0; i < 16; i++) {
    var x = i * 80 + 10, t = (x + 30) / 1280, y = 12 + 192 * t * (1 - t) - 4;
    s += '<polygon points="' + x + ',' + y + ' ' + (x + 60) + ',' + y + ' ' + (x + 30) + ',' + (y + 48) + '" fill="' + cols[i % 5] + '"/>';
  }
  return s;
}

function clockTicks() {
  var s = '';
  for (var i = 0; i < 12; i++) {
    var a = i * Math.PI / 6, r1 = 50, r2 = 58;
    s += '<line x1="' + (70 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (70 - Math.cos(a) * r1).toFixed(1) +
         '" x2="' + (70 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (70 - Math.cos(a) * r2).toFixed(1) +
         '" stroke="#7A4E2D" stroke-width="4" stroke-linecap="round"/>';
  }
  return s;
}

function checker() {
  var s = '';
  for (var r = 0; r < 3; r++) for (var c = 0; c < 16; c++) if ((r + c) % 2) {
    s += '<rect x="' + (c * 80) + '" y="' + (470 + r * 57) + '" width="80" height="57" fill="#EDB95F"/>';
  }
  return s;
}

var BG = {};
BG.living = '<svg ' + NS + ' viewBox="0 0 1280 640" width="1280" height="640">' +
  '<rect width="1280" height="640" fill="#FFE3A3"/>' + dotsFill('#FFD27A', '.8', 450) +
  '<g transform="translate(120,70)">' +
    '<rect width="260" height="210" rx="18" fill="#fff"/>' +
    '<rect x="14" y="14" width="232" height="182" rx="10" fill="#BDE6FF"/>' +
    '<circle cx="190" cy="62" r="34" fill="#FFD43B"/><circle cx="190" cy="62" r="22" fill="#FFF3B0"/>' +
    '<ellipse cx="82" cy="120" rx="52" ry="20" fill="#fff"/><ellipse cx="116" cy="106" rx="36" ry="22" fill="#fff"/>' +
    '<rect x="124" y="14" width="12" height="182" fill="#fff"/><rect x="14" y="100" width="232" height="12" fill="#fff"/>' +
  '</g>' +
  '<g transform="translate(930,80)">' +
    '<rect width="170" height="130" rx="10" fill="#B7814A"/><rect x="12" y="12" width="146" height="106" rx="6" fill="#FFF7E0"/>' +
    '<path d="M85 30 l12 26 28 3 -21 19 6 28 -25 -14 -25 14 6 -28 -21 -19 28 -3z" fill="#FF8FAB"/>' +
  '</g>' +
  '<rect y="462" width="1280" height="178" fill="#E7A862"/><rect y="454" width="1280" height="14" fill="#C98544"/>' +
  '<g stroke="#CF8F4B" stroke-width="3" opacity=".6"><line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="575" x2="1280" y2="575"/><line x1="0" y1="625" x2="1280" y2="625"/></g>' +
  '<ellipse cx="560" cy="574" rx="400" ry="56" fill="#3DB8A8"/><ellipse cx="560" cy="574" rx="330" ry="40" fill="#6AD2C4"/>' +
  '</svg>';

BG.school = '<svg ' + NS + ' viewBox="0 0 1280 640" width="1280" height="640">' +
  '<rect width="1280" height="640" fill="#D6F1E4"/>' + bunting() +
  '<g transform="translate(60,120)">' +
    '<rect x="0" y="100" width="270" height="14" rx="4" fill="#B7814A"/>' +
    '<rect x="14" y="44" width="34" height="56" rx="4" fill="#FF6B6B"/><rect x="52" y="30" width="30" height="70" rx="4" fill="#4D96FF"/>' +
    '<rect x="86" y="52" width="38" height="48" rx="4" fill="#FFD43B"/><rect x="128" y="36" width="30" height="64" rx="4" fill="#35D07F"/>' +
    '<rect x="162" y="58" width="36" height="42" rx="4" fill="#FF8FD6"/><rect x="202" y="40" width="30" height="60" rx="4" fill="#7C5CE0"/>' +
  '</g>' +
  '<g transform="translate(380,70)">' +
    '<rect width="440" height="200" rx="14" fill="#B7814A"/><rect x="14" y="14" width="412" height="172" rx="8" fill="#2F7D5B"/>' +
    '<path d="M60 90 q20 -34 40 0 t40 0 t40 0" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".9"/>' +
    '<circle cx="300" cy="86" r="34" fill="none" stroke="#FFE066" stroke-width="6" opacity=".9"/>' +
    '<path d="M366 52 l10 24 26 2 -20 17 6 25 -22 -14 -22 14 6 -25 -20 -17 26 -2z" fill="#FF9EC4" opacity=".95"/>' +
    '<rect x="40" y="160" width="60" height="10" rx="4" fill="#fff"/>' +
  '</g>' +
  '<g transform="translate(1010,90)">' +
    '<circle cx="70" cy="70" r="64" fill="#fff" stroke="#FF7A59" stroke-width="10"/>' + clockTicks() +
    '<line x1="70" y1="70" x2="70" y2="30" stroke="#2A2370" stroke-width="7" stroke-linecap="round"/>' +
    '<line x1="70" y1="70" x2="98" y2="84" stroke="#2A2370" stroke-width="7" stroke-linecap="round"/>' +
    '<circle cx="70" cy="70" r="7" fill="#FF7A59"/>' +
  '</g>' +
  '<rect y="470" width="1280" height="170" fill="#F2C879"/>' + checker() +
  '<rect y="462" width="1280" height="10" fill="#D9A850"/>' +
  '<rect x="60" y="440" width="700" height="30" rx="8" fill="#C98544"/>' +
  '<rect x="90" y="470" width="16" height="110" fill="#A86B30"/><rect x="714" y="470" width="16" height="110" fill="#A86B30"/>' +
  '</svg>';

var ART = {};
ART.lamp = '<svg ' + NS + ' viewBox="0 0 200 240" class="art" style="overflow:visible">' +
  '<circle class="glow" cx="100" cy="70" r="170" fill="url(#gLamp)" opacity="0"/>' +
  '<ellipse cx="100" cy="224" rx="54" ry="12" fill="#7A4E2D"/>' +
  '<rect x="94" y="96" width="12" height="130" rx="5" fill="#9B6B43"/>' +
  '<polygon points="56,22 144,22 176,100 24,100" fill="#FFD43B" stroke="#E7B500" stroke-width="4" stroke-linejoin="round"/>' +
  '<path d="M62 26 H138" stroke="#FFF3B0" stroke-width="7" stroke-linecap="round"/>' +
  '<path d="M42 62 H158" stroke="#FFF3B0" stroke-width="6" stroke-linecap="round" opacity=".8"/>' +
  '<circle cx="100" cy="100" r="7" fill="#FFF3B0"/></svg>';

ART.fan = '<svg ' + NS + ' viewBox="0 0 200 240" class="art" style="overflow:visible">' +
  '<ellipse cx="100" cy="226" rx="58" ry="12" fill="#3F6FB5"/>' +
  '<rect x="92" y="150" width="16" height="76" rx="6" fill="#5B8FD9"/>' +
  '<circle cx="100" cy="92" r="68" fill="#E8F3FF" stroke="#4D96FF" stroke-width="8"/>' +
  '<g class="blades" style="transform-origin:100px 92px">' +
    '<ellipse cx="100" cy="56" rx="17" ry="32" fill="#4D96FF"/>' +
    '<ellipse cx="100" cy="56" rx="17" ry="32" fill="#4D96FF" transform="rotate(90 100 92)"/>' +
    '<ellipse cx="100" cy="56" rx="17" ry="32" fill="#4D96FF" transform="rotate(180 100 92)"/>' +
    '<ellipse cx="100" cy="56" rx="17" ry="32" fill="#4D96FF" transform="rotate(270 100 92)"/>' +
  '</g>' +
  '<circle cx="100" cy="92" r="15" fill="#FFD43B" stroke="#E7B500" stroke-width="4"/>' +
  '<circle cx="95" cy="88" r="3" fill="#2A2370"/><circle cx="106" cy="88" r="3" fill="#2A2370"/></svg>';

ART.teddy = '<svg ' + NS + ' viewBox="0 0 200 240" class="art" style="overflow:visible">' +
  '<ellipse cx="100" cy="230" rx="64" ry="10" fill="#000" opacity=".12"/>' +
  '<ellipse cx="66" cy="214" rx="26" ry="20" fill="#B07A4F"/><ellipse cx="134" cy="214" rx="26" ry="20" fill="#B07A4F"/>' +
  '<ellipse cx="66" cy="216" rx="14" ry="10" fill="#E8C9A6"/><ellipse cx="134" cy="216" rx="14" ry="10" fill="#E8C9A6"/>' +
  '<ellipse cx="100" cy="164" rx="58" ry="58" fill="#B07A4F"/><ellipse cx="100" cy="172" rx="36" ry="40" fill="#E8C9A6"/>' +
  '<ellipse cx="46" cy="152" rx="16" ry="30" fill="#B07A4F" transform="rotate(20 46 152)"/>' +
  '<g class="arm" style="transform-origin:148px 132px"><ellipse cx="156" cy="148" rx="16" ry="30" fill="#B07A4F" transform="rotate(-20 156 148)"/></g>' +
  '<circle cx="62" cy="52" r="20" fill="#B07A4F"/><circle cx="62" cy="52" r="11" fill="#E8C9A6"/>' +
  '<circle cx="138" cy="52" r="20" fill="#B07A4F"/><circle cx="138" cy="52" r="11" fill="#E8C9A6"/>' +
  '<circle cx="100" cy="86" r="52" fill="#B07A4F"/><ellipse cx="100" cy="102" rx="24" ry="18" fill="#E8C9A6"/>' +
  '<ellipse cx="100" cy="94" rx="8" ry="6" fill="#3B2416"/>' +
  '<path d="M92 108 Q100 116 108 108" fill="none" stroke="#3B2416" stroke-width="3" stroke-linecap="round"/>' +
  '<circle cx="80" cy="78" r="6" fill="#3B2416"/><circle cx="120" cy="78" r="6" fill="#3B2416"/>' +
  '<circle cx="82" cy="76" r="2" fill="#fff"/><circle cx="122" cy="76" r="2" fill="#fff"/>' +
  '<polygon points="100,138 78,126 78,150" fill="#FF6B6B"/><polygon points="100,138 122,126 122,150" fill="#FF6B6B"/><circle cx="100" cy="138" r="7" fill="#E84C4C"/></svg>';

ART.ball = '<svg ' + NS + ' viewBox="0 0 200 240" class="art" style="overflow:visible">' +
  '<ellipse class="shadow" cx="100" cy="226" rx="62" ry="10" fill="#000" opacity=".14"/>' +
  '<g class="bounce">' +
    '<circle cx="100" cy="150" r="68" fill="#FF6B6B"/>' +
    '<path d="M36 124 C70 152 130 152 164 124" stroke="#fff" stroke-width="14" fill="none"/>' +
    '<path d="M34 170 C70 198 130 198 166 170" stroke="#FFD43B" stroke-width="14" fill="none"/>' +
    '<path d="M100 82 C84 120 84 180 100 218" stroke="#4D96FF" stroke-width="14" fill="none"/>' +
    '<circle cx="74" cy="118" r="12" fill="#fff" opacity=".55"/>' +

    state.locked = false;
  });
}
function celebrate() {
  if (state.mode !== 'trace' || state.locked) return;
  state.locked = true; var it = state.current, v = $('#objView');
  cancelAnimationFrame(jugRAF);
  var bw = $('#boardWrap'); bw.innerHTML = boardSVG(state.charData, it.glyph, true); bw.className = 'shrunk';
  v.className = 'rw-' + it.id;
  v.style.left = (it.rl !== undefined ? it.rl : 700) + 'px'; v.style.top = (it.rt !== undefined ? it.rt : 70) + 'px'; v.style.width = (it.rw !== undefined ? it.rw : 450) + 'px';
  setMode('reward'); sfx.chime(); confetti(); fadeInk();
  if (it.id === 'lamp') stage.classList.add('lampOn');
  setTimeout(function () { fly(it); }, 3200);
}
function fly(it) {
  var v = $('#objView'); sfx.whoosh(); stage.classList.remove('lampOn');
  v.style.left = '1120px'; v.style.top = '470px'; v.style.width = '62px';
  setTimeout(function () { finish(it); }, 1000);
}
function finish(it) {
  var r = state.room;
  state.done[r][it.id] = true; state.got[r].push(it); state.count++;
  $('#objView').style.opacity = 0;
  renderCont(); $('#cont').classList.add('wig'); setTimeout(function () { $('#cont').classList.remove('wig'); }, 800);
  state.locked = false;
  var all = ROOMS[r].items.every(function (x) { return state.done[r][x.id]; });
  if (state.count >= SESSION_ITEMS || all) endScene();
  else { renderObjs(); setMode('room'); sfx.pop(); }
}
function endScene() { setMode('end'); sfx.yawn(); }
function confetti() {
  var box = $('#confetti'); box.innerHTML = '';
  var cols = ['#FF6B6B', '#FFD43B', '#4D96FF', '#35D07F', '#FF8FD6', '#fff'];
  for (var i = 0; i < 36; i++) {
    var d = document.createElement('i');
    d.style.left = (Math.random() * 1260) + 'px'; d.style.background = cols[i % cols.length];
    d.style.animationDelay = (Math.random() * 0.8) + 's'; d.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    box.appendChild(d);
  }
  setTimeout(function () { box.innerHTML = ''; }, 4400);
}

/* ---------- ink ---------- */
var ink = { color: '#FFE066', rainbow: false };
function clearInk() { inkX.clearRect(0, 0, 1280, 640); liveX.clearRect(0, 0, 1280, 640); inkC.style.opacity = 1; }
function fadeInk() {
  inkC.style.transition = 'opacity .5s'; inkC.style.opacity = 0;
  setTimeout(function () { inkX.clearRect(0, 0, 1280, 640); inkC.style.transition = 'none'; inkC.style.opacity = 1; }, 600);
}
function drawStroke(c, pts, st) {
  if (!pts.length) return;
  c.lineCap = 'round'; c.lineJoin = 'round';
  var i;
  if (st.rainbow) {
    c.globalAlpha = 1; c.lineWidth = 22;
    if (pts.length === 1) pts = [pts[0], [pts[0][0] + 0.01, pts[0][1]]];
    for (i = 1; i < pts.length; i++) {
      c.strokeStyle = 'hsl(' + ((i * 9) % 360) + ',90%,60%)';
      c.beginPath(); c.moveTo(pts[i - 1][0], pts[i - 1][1]); c.lineTo(pts[i][0], pts[i][1]); c.stroke();
    }
    return;
  }
  function path() {
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    if (pts.length === 1) c.lineTo(pts[0][0] + 0.01, pts[0][1]);
    for (var k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);
  }
  c.globalAlpha = 0.28; c.strokeStyle = st.color; c.lineWidth = 42; path(); c.stroke();
  c.globalAlpha = 0.5; c.lineWidth = 26; path(); c.stroke();
  c.globalAlpha = 1; c.strokeStyle = '#FFFDF0'; c.lineWidth = 12; path(); c.stroke();
}
var drawing = null, raf = 0;
function toStage(e) { return [(e.clientX - offX) / scale, (e.clientY - offY) / scale]; }
function requestDraw() {
  if (raf) return;
  raf = requestAnimationFrame(function () { raf = 0; if (!drawing) return; liveX.clearRect(0, 0, 1280, 640); drawStroke(liveX, drawing.pts, ink); });
}
stage.addEventListener('pointerdown', function (e) {
  if (state.mode !== 'trace' && state.mode !== 'draw') return;
  if (e.target.closest && e.target.closest('.btn,.sw')) return;
  if (drawing) return;
  drawing = { id: e.pointerId, pts: [toStage(e)], len: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  requestDraw(); e.preventDefault();
});
stage.addEventListener('pointermove', function (e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if (!evs.length) evs = [e];
  for (var i = 0; i < evs.length; i++) {
    var p = toStage(evs[i]), last = drawing.pts[drawing.pts.length - 1], d = Math.hypot(p[0] - last[0], p[1] - last[1]);
    if (d < 1.5) continue;
    drawing.len += d; drawing.pts.push(p);
  }
  requestDraw();
});
function lift(e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  var d = drawing; drawing = null;
  drawStroke(inkX, d.pts, ink); liveX.clearRect(0, 0, 1280, 640);
  if (state.mode === 'trace' && d.len >= 120) { state.lifts++; sfx.tick(); if (state.lifts >= state.need) setTimeout(celebrate, 350); }
}
stage.addEventListener('pointerup', lift);
stage.addEventListener('pointercancel', lift);
stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- buttons ---------- */
function bind(id, fn) { $(id).addEventListener('click', function () { ac(); fn(); }); }
bind('#bHome', function () { sfx.pop(); setMode('home'); });
bind('#bBack', function () {
  sfx.pop(); cancelAnimationFrame(jugRAF); clearInk(); state.locked = false;
  if (state.mode === 'draw') setMode(state.lastMode); else setMode('room');
});
bind('#bSkip', function () { celebrate(); });
bind('#bBrush', function () { sfx.pop(); state.lastMode = state.mode; clearInk(); ink.color = '#FFE066'; ink.rainbow = false; setMode('draw'); });
bind('#bClear', function () { sfx.pop(); clearInk(); });
bind('#bReplay', function () {
  sfx.pop(); state.count = 0; state.done = { living: {}, school: {} }; state.got = { living: [], school: [] };
  setMode('home');
});

/* ---------- home + palette ---------- */
function buildHome() {
  var h = $('#home'); h.innerHTML = '';
  [['living', 140, ICON.house], ['school', 660, ICON.school]].forEach(function (a) {
    var c = document.createElement('div'); c.className = 'card'; c.style.left = a[1] + 'px';
    c.innerHTML = '<div class="thumb">' + ROOMS[a[0]].bg + '</div><div class="cardIcon">' + a[2] + '</div>';
    c.addEventListener('click', function () { ac(); sfx.pop(); enterRoom(a[0]); });
    h.appendChild(c);
  });
}
function buildPalette() {
  var p = $('#palette'); p.innerHTML = '';
  ['#FFE066', '#FF6B6B', '#4D96FF', '#35D07F', '#FF8FD6', '#FFFFFF', 'rainbow'].forEach(function (col) {
    var b = document.createElement('div'); b.className = 'sw' + (col === 'rainbow' ? ' rb' : '');
    if (col !== 'rainbow') b.style.background = col;
    b.addEventListener('click', function () { ac(); sfx.tick(); if (col === 'rainbow') { ink.rainbow = true; } else { ink.rainbow = false; ink.color = col; } });
    p.appendChild(b);
  });
}

/* ---------- start ---------- */
$('#bBack').innerHTML = ICON.back; $('#bSkip').innerHTML = ICON.skip; $('#bHome').innerHTML = ICON.house;
$('#bBrush').innerHTML = ICON.crayon; $('#bClear').innerHTML = ICON.eraser; $('#bReplay').innerHTML = ICON.replay;
$('#endPaper').innerHTML = ICON.paper + ICON.pencil; $('#moon').innerHTML = ICON.moon;
fit(); buildHome(); buildPalette(); setMode('home');
window.__mock = { state: state, setMode: setMode, enterRoom: enterRoom, celebrate: celebrate };
})();

</script>
