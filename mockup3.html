<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2A2370">
<title>Trace &amp; Discover - rooms mockup 3</title>
<style>
:root { color-scheme: light; --lc: #FF6B6B; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1D1747; overscroll-behavior: none; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  font-family: "Arial Rounded MT Bold", Arial, sans-serif; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; overflow: hidden; background: #FFE3A3; touch-action: none; }
.hide { display: none !important; }
.layer { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; pointer-events: none; }
.ur { direction: rtl; font-family: "Noto Naskh Arabic", "Noto Nastaliq Urdu", "Segoe UI", "Arial", serif; }

#bg { z-index: 1; }
#drawBg { z-index: 1; background: radial-gradient(circle at 50% 40%, #3B2F8F, #1D1747); }
#welcome, #place { z-index: 2; background: linear-gradient(#FFE3A3, #FFBE5C); }
#veil { z-index: 2; }
[data-mode=board] #veil { background: rgba(255,255,255,.3); }
[data-mode=write] #veil { background: rgba(255,255,255,.5); }
[data-mode=find] #veil { background: rgba(255,255,255,.08); }
[data-mode=name] #veil { background: rgba(255,255,255,.5); }
[data-mode=end] #veil { background: linear-gradient(rgba(29,23,71,.82), rgba(42,35,112,.62)); }
#warm { z-index: 2; background: radial-gradient(circle at 900px 230px, rgba(255,236,150,.9), rgba(255,236,150,0) 62%); opacity: 0; transition: opacity .8s; }
.lampOn #warm { opacity: 1; }

/* cards */
.card { position: absolute; top: 150px; width: 480px; height: 340px; border-radius: 40px; background: #fff; box-shadow: 0 12px 0 rgba(0,0,0,.16); overflow: hidden; pointer-events: auto; cursor: pointer; }
.card:active { transform: translateY(6px); box-shadow: 0 6px 0 rgba(0,0,0,.16); }
.card.big { width: 360px; display: flex; align-items: center; justify-content: center; font-weight: 900; }
.card.big span { font-size: 128px; line-height: 1; }
.card.big .ur { font-size: 108px; }
.welG1 { color: #FF6B6B; } .welG2 { color: #2F7CF0; } .welG3 { color: #1FAF6B; }
.thumb { width: 480px; height: 240px; overflow: hidden; }
.thumb svg { transform: scale(.375); transform-origin: 0 0; display: block; }
.cardIcon { position: absolute; left: 198px; top: 200px; width: 84px; height: 84px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 rgba(0,0,0,.15); display: flex; align-items: center; justify-content: center; }
.cardIcon svg { width: 58px; height: 58px; }
.card.place3 { width: 360px; }
.place3 .thumb { width: 360px; height: 180px; }
.place3 .thumb svg { transform: scale(.28125); }
.place3 .cardIcon { left: 138px; top: 210px; }

/* the letter board */
#panel { position: absolute; z-index: 4; left: 40px; top: 128px; width: 1200px; height: 488px; border-radius: 36px; pointer-events: none; }
#panel.school { background: #2F7D5B; border: 14px solid #B7814A; box-shadow: inset 0 0 40px rgba(0,0,0,.25); }
#panel.home { background: #E6F4FF; border: 14px solid #fff; box-shadow: 0 0 0 5px #BFD9EE; }
#panel .grid { display: grid; gap: 8px; padding: 14px; width: 100%; height: 100%; align-content: center; }
.cell { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 20px; font-weight: 900; aspect-ratio: 1 / 1; pointer-events: auto; cursor: pointer; line-height: 1; }
.set-num .cell { aspect-ratio: auto; height: 190px; }
.set-urdu .cell { aspect-ratio: auto; height: 96px; }
.set-urdu .grid { direction: rtl; }
.school .cell.on { color: #fff; background: rgba(255,255,255,.14); box-shadow: inset 0 0 0 5px var(--c); }
.school .cell.off { color: #fff; opacity: .2; }
.home .cell.on { color: var(--c); background: #fff; box-shadow: inset 0 0 0 5px var(--c); }
.home .cell.off { color: #7A8CA8; opacity: .3; }
#panel.kitchen { background: #F7FAFD; border: 14px solid #DDE5EE; box-shadow: inset -26px 0 0 #EDF2F7; }
#panel.kitchen::after { content: ""; position: absolute; right: 2px; top: 130px; width: 14px; height: 200px; border-radius: 7px; background: #A0AEC0; }
.kitchen .cell.on { color: #fff; background: var(--c); box-shadow: 0 6px 0 rgba(0,0,0,.18); border-radius: 26px; }
.kitchen .cell.off { color: #B8C4D2; opacity: .55; }
.cell.on { animation: cellpulse 2.4s ease-in-out infinite; }
@keyframes cellpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.cell .star::before { content: "\2605"; position: absolute; top: 4px; right: 8px; color: #FFC21A; font-size: 30px; text-shadow: 0 0 0 #fff; }
.cell.shake { animation: shake .4s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
#minisTop { position: absolute; z-index: 6; left: 760px; top: 12px; width: 470px; display: flex; gap: 6px; justify-content: flex-end; pointer-events: none; }
#minisTop .mini { width: 70px; }
.mini svg { display: block; width: 100%; height: auto; }

/* writing board and its states */
#board { z-index: 4; }
#boardWrap { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; transition: transform .9s cubic-bezier(.3,.9,.3,1); }
#boardWrap.small { transform: translate(120px,10px) scale(.36); }
#boardWrap.big { transform: translate(24px,110px) scale(.55); }
.pulse circle { animation: dotpulse .5s ease-in-out 3; transform-box: fill-box; transform-origin: center; }
@keyframes dotpulse { 50% { transform: scale(1.5); } }

/* practice rounds */
#rounds { position: absolute; z-index: 6; left: 870px; top: 44px; display: flex; gap: 12px; pointer-events: none; }
#rounds .rl { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.75); border: 5px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.12); transition: background .3s, box-shadow .3s; }
#rounds .rl.now { border-color: #35D07F; }
#rounds .rl.on { background: #FFD43B; box-shadow: 0 0 18px #FFD43B, 0 4px 0 rgba(0,0,0,.12); animation: lightup .5s ease; }
#rounds .rl.help { background: #FFE9A8; }
@keyframes lightup { 50% { transform: scale(1.3); } }
#bBrush.offer { animation: offer 1s ease-in-out infinite; }
@keyframes offer { 50% { transform: scale(1.15) rotate(-8deg); } }

/* room objects (find) */
#objLayer { z-index: 3; }
.obj { position: absolute; pointer-events: auto; transform-origin: 50% 100%; }
.obj svg { display: block; width: 100%; height: auto; }
.obj.hit { cursor: pointer; z-index: 2; animation: hitbounce 1.1s ease-in-out infinite; filter: drop-shadow(0 0 12px #FFE066) drop-shadow(0 0 26px #FFD43B); }
.obj.dim { opacity: .3; filter: grayscale(.85); pointer-events: none; }
@keyframes hitbounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.08); } }

/* toy box / backpack */
#cont { position: absolute; z-index: 5; left: 1100px; top: 470px; width: 150px; }
#cont > svg { display: block; width: 150px; height: 150px; }
#cont .minis { position: absolute; left: -16px; bottom: 140px; width: 200px; display: flex; gap: 2px; align-items: flex-end; }
#cont .mini { width: 62px; }
#cont.wig { animation: wig .7s ease; }
@keyframes wig { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }

/* naming step */
#objView { position: absolute; z-index: 5; pointer-events: none;
  transition: left .9s cubic-bezier(.3,.9,.3,1), top .9s cubic-bezier(.3,.9,.3,1), width .9s cubic-bezier(.3,.9,.3,1), opacity .4s; }
#objView svg { display: block; width: 100%; height: auto; }
#wordLabel { position: absolute; z-index: 6; left: 700px; top: 500px; width: 380px; text-align: center; font-size: 62px; font-weight: 900; color: #2A2370; pointer-events: none; white-space: nowrap; transition: opacity .3s; }
#wordLabel.gone { opacity: 0; }
#wordLabel { background: rgba(255,255,255,.92); border-radius: 40px; padding: 2px 0 6px; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
#objView.counting { pointer-events: auto; }
#objView.counting svg { pointer-events: none; }
#objView.counting .cnt { pointer-events: auto; cursor: pointer; }
.counting .cnt { transform-box: fill-box; transform-origin: center; }
.counting .cnt:not(.counted) { animation: breathe 1.1s ease-in-out infinite; }
.counting .counted { animation: countpop .35s ease; }
.counted .num, .counted.num { opacity: 1 !important; }
@keyframes breathe { 50% { transform: scale(1.07); } }
@keyframes countpop { 50% { transform: scale(1.25) translateY(-8px); } }
#objView.cheer { animation: cheer .6s ease 2; }
@keyframes cheer { 50% { transform: translateY(-24px) scale(1.04); } }
.steam, .scoop2, .drops { opacity: 0; }
.cheer .steam { opacity: 1; animation: rise 1.6s ease-in infinite; }
.cheer .lid2 { animation: hop2 .4s ease-in-out infinite; }

/* reward animations */
.glow { transition: opacity .6s; transform-box: fill-box; transform-origin: center; }
.rw-lamp .glow { opacity: 1 !important; animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.12); } }
@keyframes spin { to { transform: rotate(360deg); } }
.rw-fan .blades { animation: spin .55s linear infinite; }
@keyframes rub { from { transform: translateX(-14px) rotate(-4deg); } to { transform: translateX(14px) rotate(4deg); } }
.rw-eraser .wob { animation: rub .45s ease-in-out infinite alternate; }
.pop { opacity: 0; }
.rw-lunch .lid { animation: openlid 1.2s ease forwards; }
@keyframes openlid { to { transform: rotate(-56deg); } }
.rw-lunch .pop { animation: popup 1.6s .7s ease forwards; }
@keyframes popup { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(-58px); opacity: 1; } }
.rw-flag .cloth { animation: flutter .5s ease-in-out infinite alternate; }
@keyframes flutter { from { transform: skewY(-7deg); } to { transform: skewY(7deg); } }
.rw-egg .egg { animation: wobble .5s ease-in-out infinite alternate; }
@keyframes wobble { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
.rw-hat .swing { animation: swing .8s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
.rw-heart .beat { animation: beat .7s ease-in-out infinite; }
@keyframes beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.14); } }
.rw-ink .bottle { animation: rub .5s ease-in-out infinite alternate; }
.rw-ink .drop { animation: dropfall 1.1s ease-in infinite; }
@keyframes dropfall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(120px); opacity: 0; } }
.rw-insect .bug { animation: crawl .6s ease-in-out infinite alternate; }
@keyframes crawl { from { transform: translateX(-12px) rotate(-6deg); } to { transform: translateX(12px) rotate(6deg); } }
.rw-toys .tb1 { animation: hop2 .8s ease-in-out infinite; }
.rw-toys .tb2 { animation: hop2 .8s .2s ease-in-out infinite; }
.rw-toys .tcar { animation: drive 1s ease-in-out infinite alternate; }
@keyframes hop2 { 50% { transform: translateY(-16px); } }
@keyframes drive { from { transform: translateX(-12px); } to { transform: translateX(4px); } }
.rw-tiger .tilt { animation: tilt .7s ease-in-out infinite alternate; }
@keyframes tilt { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.cheer .minute { animation: spin 1.2s linear 2; }
.rw-fork .fk { animation: wobble .4s ease-in-out infinite alternate; }
.rw-honey .jar { animation: wobble .6s ease-in-out infinite alternate; }
.rw-honey .drip { animation: dropfall 1.1s ease-in infinite; }
.rw-ice .scoop2 { animation: popin .5s .3s ease both; }
.rw-ice .cherry { animation: cherryup .5s .3s ease both; }
@keyframes popin { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes cherryup { to { transform: translateY(-44px); } }
.rw-lemon .lem { animation: wobble .45s ease-in-out infinite alternate; }
.rw-lemon .drops { opacity: 1; animation: rise 1.4s ease-out infinite; }
.rw-tomato .tom { animation: hop2 .6s ease-in-out infinite; }
@keyframes chairhop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-34px) scale(1.08); } }
@keyframes shownum { to { opacity: 1; } }
.num { opacity: 0; }
.rw-chairs .chair { animation: chairhop .8s ease-in-out both; }
.rw-chairs .chair .num { animation: shownum .1s both; }
.rw-chairs .c1, .rw-chairs .c1 .num { animation-delay: 0.4s; }
.rw-chairs .c2, .rw-chairs .c2 .num { animation-delay: 0.95s; }
.rw-chairs .c3, .rw-chairs .c3 .num { animation-delay: 1.5s; }
.rw-chairs .c4, .rw-chairs .c4 .num { animation-delay: 2.05s; }

#confetti { z-index: 7; overflow: hidden; }
#confetti i { position: absolute; top: -30px; width: 14px; height: 22px; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(700px) rotate(600deg); } }

/* end of session */
#moon { position: absolute; z-index: 6; left: 1040px; top: 40px; }
#endUI { position: absolute; z-index: 6; left: 340px; top: 478px; width: 520px; height: 144px; border-radius: 36px; background: rgba(255,255,255,.93); display: flex; align-items: center; justify-content: center; pointer-events: none; }
#endPaper { display: flex; align-items: center; gap: 30px; }
#endPaper svg:first-child { width: 84px; height: 105px; }
#endPaper svg:last-child { width: 170px; height: 42px; transform: rotate(-18deg); }
#zz { position: absolute; z-index: 8; left: 690px; top: 330px; pointer-events: none; }
#zz i { position: absolute; border-radius: 50%; background: #fff; opacity: .7; animation: rise 3s ease-in infinite; }
#zz i:nth-child(1) { width: 16px; height: 16px; left: 0; }
#zz i:nth-child(2) { width: 22px; height: 22px; left: 26px; animation-delay: 1s; }
#zz i:nth-child(3) { width: 30px; height: 30px; left: 60px; animation-delay: 2s; }
@keyframes rise { from { transform: translateY(60px); opacity: 0; } 30% { opacity: .75; } to { transform: translateY(-80px); opacity: 0; } }

/* ink and Jugnu */
#ink, #live { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; pointer-events: none; z-index: 9; }
#jug { position: absolute; z-index: 10; width: 120px; height: 120px; pointer-events: none; }
#jug .jb { animation: bob 2.6s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
.sleepy #jug .jb { animation: none; transform: rotate(78deg) scale(.9); opacity: .85; }

/* buttons */
.btn { position: absolute; z-index: 11; width: 96px; height: 96px; border-radius: 50%; background: #fff; box-shadow: 0 7px 0 rgba(0,0,0,.18);
  display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
.btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
#bBack { left: 24px; top: 16px; }
#bSkip { left: 1160px; top: 16px; opacity: .3; }
#bBrush { left: 24px; top: 520px; }
#bClear { left: 1160px; top: 520px; }
#bReplay { left: 890px; top: 502px; }
#palette { position: absolute; z-index: 11; left: 306px; top: 540px; display: flex; gap: 18px; pointer-events: none; }
.sw { width: 80px; height: 80px; border-radius: 50%; border: 6px solid #fff; box-shadow: 0 5px 0 rgba(0,0,0,.25); cursor: pointer; pointer-events: auto; }
.sw.rb { background: conic-gradient(red, orange, yellow, lime, cyan, blue, magenta, red); }
</style>
</head>
<body>
<div id="stage" data-mode="welcome">
  <div id="bg" class="layer" data-modes="board write find name end"></div>
  <div id="drawBg" class="layer" data-modes="draw"></div>
  <div id="welcome" class="layer" data-modes="welcome"></div>
  <div id="place" class="layer" data-modes="place"></div>
  <div id="veil" class="layer" data-modes="board write find name end"></div>
  <div id="warm" class="layer"></div>
  <div id="panel" data-modes="board"></div>
  <div id="board" class="layer" data-modes="write find name"><div id="boardWrap"></div></div>
  <div id="objLayer" class="layer" data-modes="find"></div>
  <div id="objView" data-modes="name"></div>
  <div id="wordLabel" data-modes="name"></div>
  <div id="cont" data-modes="find name end"></div>
  <div id="minisTop" data-modes="board"></div>
  <div id="rounds" data-modes="write"></div>
  <div id="moon" data-modes="end"></div>
  <div id="endUI" data-modes="end"><div id="endPaper"></div></div>
  <div id="zz" data-modes="end"><i></i><i></i><i></i></div>
  <div id="confetti" class="layer"></div>
  <canvas id="ink" data-modes="write draw"></canvas>
  <canvas id="live" data-modes="write draw"></canvas>
  <div id="jug"></div>
  <div id="palette" data-modes="draw"></div>
  <div class="btn" id="bBack" role="button" aria-label="Back" data-modes="place board write find draw"></div>
  <div class="btn" id="bSkip" role="button" aria-label="Parent: skip ahead" data-modes="write"></div>
  <div class="btn" id="bBrush" role="button" aria-label="Free drawing" data-modes="board end write"></div>
  <div class="btn" id="bClear" role="button" aria-label="Clear the drawing" data-modes="draw"></div>
  <div class="btn" id="bReplay" role="button" aria-label="Play again" data-modes="end"></div>
</div>
<script>
/* Art for the room mockup. Plain SVG strings, no external files. */
var NS = 'xmlns="http://www.w3.org/2000/svg"';

var DEFS = '<svg ' + NS + ' width="0" height="0" style="position:absolute" aria-hidden="true"><defs>' +
  '<radialGradient id="gLamp"><stop offset="0" stop-color="#FFF3A8" stop-opacity=".95"/><stop offset=".55" stop-color="#FFE066" stop-opacity=".45"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient>' +
  '<radialGradient id="gJug"><stop offset="0" stop-color="#FFE066" stop-opacity=".9"/><stop offset="1" stop-color="#FFE066" stop-opacity="0"/></radialGradient>' +
  '</defs></svg>';

function dotsFill(color, opacity, maxY) {
  var s = '';
  for (var y = 30; y < maxY; y += 60) {
    for (var x = (((y - 30) / 60) % 2 ? 60 : 30); x < 1280; x += 60) {
      s += '<circle cx="' + x + '" cy="' + y + '" r="5" fill="' + color + '" opacity="' + opacity + '"/>';
    }
  }
  return s;
}

function bunting() {
  var cols = ['#FF6B6B', '#FFD43B', '#4D96FF', '#35D07F', '#FF8FD6'];
  var s = '<path d="M0 12 Q640 108 1280 12" stroke="#7A4E2D" stroke-width="4" fill="none"/>';
  for (var i = 0; i < 16; i++) {
    var x = i * 80 + 10, t = (x + 30) / 1280, y = 12 + 192 * t * (1 - t) - 4;
    s += '<polygon points="' + x + ',' + y + ' ' + (x + 60) + ',' + y + ' ' + (x + 30) + ',' + (y + 48) + '" fill="' + cols[i % 5] + '"/>';
  }
  return s;
}

function clockTicks() {
  var s = '';
  for (var i = 0; i < 12; i++) {
    var a = i * Math.PI / 6, r1 = 50, r2 = 58;
    s += '<line x1="' + (70 + Math.sin(a) * r1).toFixed(1) + '" y1="' + (70 - Math.cos(a) * r1).toFixed(1) +
         '" x2="' + (70 + Math.sin(a) * r2).toFixed(1) + '" y2="' + (70 - Math.cos(a) * r2).toFixed(1) +
         '" stroke="#7A4E2D" stroke-width="4" stroke-linecap="round"/>';
  }
  return s;
}

function checker() {
  var s = '';
  for (var r = 0; r < 3; r++) for (var c = 0; c < 16; c++) if ((r + c) % 2) {
    s += '<rect x="' + (c * 80) + '" y="' + (470 + r * 57) + '" width="80" height="57" fill="#EDB95F"/>';
  }
  return s;
}

var BG = {};
BG.living = '<svg ' + NS + ' viewBox="0 0 1280 640" width="1280" height="640">' +
  '<rect width="1280" height="640" fill="#FFE3A3"/>' + dotsFill('#FFD27A', '.8', 450) +
  '<g transform="translate(120,70)">' +
    '<rect width="260" height="210" rx="18" fill="#fff"/>' +
    '<rect x="14" y="14" width="232" height="182" rx="10" fill="#BDE6FF"/>' +
    '<circle cx="190" cy="62" r="34" fill="#FFD43B"/><circle cx="190" cy="62" r="22" fill="#FFF3B0"/>' +
    '<ellipse cx="82" cy="120" rx="52" ry="20" fill="#fff"/><ellipse cx="116" cy="106" rx="36" ry="22" fill="#fff"/>' +
    '<rect x="124" y="14" width="12" height="182" fill="#fff"/><rect x="14" y="100" width="232" height="12" fill="#fff"/>' +
  '</g>' +
  '<g transform="translate(930,80)">' +
    '<rect width="170" height="130" rx="10" fill="#B7814A"/><rect x="12" y="12" width="146" height="106" rx="6" fill="#FFF7E0"/>' +
    '<path d="M85 30 l12 26 28 3 -21 19 6 28 -25 -14 -25 14 6 -28 -21 -19 28 -3z" fill="#FF8FAB"/>' +
  '</g>' +
  '<rect y="462" width="1280" height="178" fill="#E7A862"/><rect y="454" width="1280" height="14" fill="#C98544"/>' +
  '<g stroke="#CF8F4B" stroke-width="3" opacity=".6"><line x1="0" y1="520" x2="1280" y2="520"/><line x1="0" y1="575" x2="1280" y2="575"/><line x1="0" y1="625" x2="1280" y2="625"/></g>' +
  '<ellipse cx="560" cy="574" rx="400" ry="56" fill="#3DB8A8"/><ellipse cx="560" cy="574" rx="330" ry="40" fill="#6AD2C4"/>' +
  '</svg>';

BG.school = '<svg ' + NS + ' viewBox="0 0 1280 640" width="1280" height="640">' +
  '<rect width="1280" height="640" fill="#D6F1E4"/>' + bunting() +

function scoreDot(child, refPoint, stage = 1, cfg = DEFAULTS) {
  if (child.length === 0) return { ok: false, reason: 'missing', error: Infinity };

function nearestOnPath(p, pts) {

  for (var i = 0; i < ROUNDS; i++) { var d = document.createElement('i'); d.className = 'rl' + (i < S.round ? (S.helpedRounds[i] ? ' on help' : ' on') : (i === S.round ? ' now' : '')); r.appendChild(d); }
}

/* ---------- screens ---------- */
function buildWelcome() {
  var w = $('#welcome'); w.innerHTML = '';
  [['abc', 60, 'ABC', 'welG1'], ['num', 460, '123', 'welG2'], ['urdu', 860, 'ا ب پ', 'welG3']].forEach(function (a) {
    var c = document.createElement('div'); c.className = 'card big ' + a[3]; c.style.left = a[1] + 'px';
    c.innerHTML = '<span' + (a[0] === 'urdu' ? ' class="ur"' : '') + '>' + a[2] + '</span>';
    c.addEventListener('click', function () { ac(); sfx.pop(); S.set = a[0]; setMode('place'); });
    w.appendChild(c);
  });
}
function buildPlace() {
  var h = $('#place'); h.innerHTML = '';
  [['school', 60, ICON.school], ['home', 460, ICON.house], ['kitchen', 860, ICON.pot]].forEach(function (a) {
    var c = document.createElement('div'); c.className = 'card place3'; c.style.left = a[1] + 'px';
    c.innerHTML = '<div class="thumb">' + ROOMS[a[0]].bg + '</div><div class="cardIcon">' + a[2] + '</div>';
    c.addEventListener('click', function () { ac(); sfx.pop(); S.room = a[0]; enterBoard(); });
    h.appendChild(c);
  });
}
function enterBoard() {
  $('#bg').innerHTML = ROOMS[S.room].bg; renderCont(); buildBoard(); setMode('board');
  S.ready.then(function () { if (S.mode === 'board') buildBoard(); });
}
function buildBoard() {
  var p = $('#panel'); p.className = S.room + ' set-' + S.set; p.innerHTML = '';
  var g = document.createElement('div'); g.className = 'grid'; g.style.gridTemplateColumns = 'repeat(' + COLS[S.set] + ', 1fr)';
  SETS[S.set].forEach(function (id) {
    var on = !!S.rec[id], c = document.createElement('div');
    c.className = 'cell ' + (on ? 'on' : 'off'); c.style.setProperty('--c', colorOf(S.set, id)); c.style.fontSize = FONT[S.set] + 'px';
    c.innerHTML = '<span' + (S.set === 'urdu' ? ' class="ur"' : '') + '>' + id + '</span>' + (S.stars[S.set][id] ? '<i class="star"></i>' : '');
    c.addEventListener('click', function () {
      ac();
      if (!on) { sfx.nope(); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }
      sfx.pop(); startWrite(id);
    });
    g.appendChild(c);
  });
  p.appendChild(g);
}

/* ---------- writing ---------- */
var inkStyle = { color: '#FFFFFF', core: '#FFFFFF' };
function key() { return S.set + ':' + S.glyph; }
function startWrite(id) {
  S.glyph = id; S.data = S.rec[id]; S.sdone = {}; S.fails = 0; S.locked = false; S.missRow = 0; S.helped = false;
  var p = S.prog[key()]; S.round = p && p.round < ROUNDS ? p.round : 0; S.helpedRounds = p && p.round < ROUNDS ? p.helped : {};
  inkStyle = writeInk();
  $('#boardWrap').className = ''; setMode('write'); renderWrite(); clearInk();
  startRoundHint();
}
function writeInk() { return { school: { color: '#FFFFFF', core: '#FFFFFF' }, home: { color: '#4D6BFF', core: '#1D2B8F' }, kitchen: { color: '#FF6B6B', core: '#C81E3A' } }[S.room]; }
function startRoundHint() {
  cancelAnimationFrame(jugRAF);
  var st = stageOf(S.round), p0 = strokeStage(nextIdx());
  if (st === 1) jugDemo(p0); else if (st === 2) jugSet(p0[0][0] - 100, p0[0][1] - 110, true); else jugSet(900, 200, true);
}
function react(r) {
  var nx = nextIdx(); sfx.nope();
  if (r && r.reason === 'wrong-start') {
    renderWrite(nx); var a = strokeStage(nx)[0]; jugSet(a[0] - 60, a[1] - 100, true);
    if (stageOf(S.round) === 3) { $('#boardWrap').innerHTML = boardSVG(S.data, S.sdone, S.room, nx, 2); }
    setTimeout(function () { if (S.mode === 'write') renderWrite(); }, 1600);
  } else { jugDemo(strokeStage(nx)); }
}
function help() {
  S.locked = true; var nx = nextIdx();
  S.helped = true;
  jugDemo(strokeStage(nx), function () { S.sdone[nx] = true; S.fails = 0; sfx.good(); renderWrite(); S.locked = false; if (allDone()) roundDone(); });
}
function handleLift(d) {
  if (S.locked) return;
  var units = d.pts.map(toUnits);
  if (pathLength(units) < 0.05) { clearInkSoon(); return; }
  var best = null, first = null;
  candidates().forEach(function (c) {
    var r = scoreStroke(units, c.ref, stageOf(S.round)); if (!first) first = r;
    if (r.ok && (!best || r.error < best.r.error)) best = { c: c, r: r };
  });
  if (best) {
    best.c.covers.forEach(function (i) { S.sdone[i] = true; }); S.fails = 0; S.missRow = 0; sfx.good(); renderWrite(); clearInkSoon();
    if (allDone()) roundDone(); else if (stageOf(S.round) === 1) jugDemo(strokeStage(nextIdx()));
  } else {
    S.fails++; S.missRow++; fadeInk(); react(first);
    if (S.missRow === MISSES_FOR_CRAYON) { var b = $('#bBrush'); b.classList.remove('hide'); b.classList.add('offer'); }
    if (S.fails >= FAILS_FOR_HELP) setTimeout(help, 900);
  }
}
function roundDone() {
  cancelAnimationFrame(jugRAF); S.locked = true; S.helpedRounds[S.round] = S.helped; S.round++; S.helped = false;
  S.prog[key()] = { round: S.round, helped: S.helpedRounds };
  sfx.chime(); renderWrite();
  if (S.round >= ROUNDS) { setTimeout(letterDone, 400); return; }
  setTimeout(function () { if (S.mode !== 'write') return; S.sdone = {}; S.fails = 0; clearInk(); renderWrite(); S.locked = false; startRoundHint(); }, 1100);
}
function letterDone() {
  S.locked = true; S.data.strokes.forEach(function (_, i) { S.sdone[i] = true; });
  $('#boardWrap').innerHTML = boardSVG(S.data, S.sdone, S.room, -1, 1);
  setTimeout(find, 1100);
}
function find() {
  var layer = $('#objLayer'); layer.innerHTML = '';
  ROOMS[S.room].items.forEach(function (it, i) {
    var d = document.createElement('div'), hit = it.glyph === S.glyph;
    d.className = 'obj ' + (hit ? 'hit' : 'dim'); d.style.left = it.left + 'px'; d.style.top = it.top + 'px'; d.style.width = it.w + 'px';
    d.style.animationDelay = (i * 0.2) + 's'; d.innerHTML = it.art;
    if (hit) d.addEventListener('click', function () { name(it); });
    layer.appendChild(d);
  });
  $('#boardWrap').className = 'small'; setMode('find'); S.locked = false;
}
function wordHTML(word, color) { return '<b style="color:' + color + '">' + word.charAt(0) + '</b>' + word.slice(1); }
function name(it) {
  if (S.locked || S.mode !== 'find') return;
  S.locked = true; S.item = it; ac();
  var v = $('#objView'); v.className = ''; v.innerHTML = it.art; v.style.transition = 'none'; v.style.opacity = 1;
  v.style.left = it.left + 'px'; v.style.top = it.top + 'px'; v.style.width = it.w + 'px';
  void v.offsetWidth; v.style.transition = '';
  $('#wordLabel').innerHTML = wordHTML(it.word, colorOf(S.set, S.glyph)); $('#wordLabel').classList.toggle('gone', !!it.count);
  $('#boardWrap').className = 'big'; setMode('name'); v.className = it.count ? 'counting' : 'rw-' + it.id;
  requestAnimationFrame(function () {
    v.style.left = (it.rl !== undefined ? it.rl : 700) + 'px'; v.style.top = (it.rt !== undefined ? it.rt : 40) + 'px'; v.style.width = (it.rw !== undefined ? it.rw : 380) + 'px';
  });
  if (it.count) { startCounting(it); return; }
  sfx.chime(); confetti(); if (it.id === 'lamp') stage.classList.add('lampOn');
  setTimeout(function () { fly(it); }, 3400);
}
function startCounting(it) {
  var v = $('#objView'), targets = [].slice.call(v.querySelectorAll('.cnt'));
  if (!targets.length) { var sv = v.querySelector('svg'); sv.classList.add('cnt'); targets = [sv]; }
  S.counted = 0; S.countTarget = targets.length; sfx.pop();
  targets.forEach(function (el) { el.addEventListener('click', function () { countTap(el, it); }); });
}
function countTap(el, it) {
  if (S.mode !== 'name' || el.classList.contains('counted') || S.counted >= S.countTarget) return;
  S.counted++; el.classList.add('counted'); var n = el.querySelector('.num'); if (n) n.textContent = S.counted;
  tone(392 * Math.pow(1.12, S.counted), 0.18, 'sine', 0.18);
  if (S.counted >= S.countTarget) {
    var v = $('#objView'); v.classList.add('cheer'); $('#wordLabel').classList.remove('gone');
    setTimeout(function () { sfx.chime(); confetti(); }, 250);
    setTimeout(function () { fly(it); }, 2800);
  }
}
function fly(it) {
  var v = $('#objView'); sfx.whoosh(); stage.classList.remove('lampOn'); $('#wordLabel').classList.add('gone');
  v.style.left = '1120px'; v.style.top = '470px'; v.style.width = '62px';
  setTimeout(function () { finish(it); }, 1000);
}
function finish(it) {
  S.stars[S.set][S.glyph] = true; S.got.push(it); S.count++;
  $('#objView').style.opacity = 0; $('#wordLabel').classList.remove('gone');
  renderCont(); $('#cont').classList.add('wig'); setTimeout(function () { $('#cont').classList.remove('wig'); }, 800);
  S.locked = false;
  if (S.count >= SESSION_LETTERS) { setMode('end'); sfx.yawn(); }
  else { buildBoard(); setMode('board'); sfx.pop(); }
}
function renderCont() {
  var c = $('#cont'); c.innerHTML = CONT[ROOMS[S.room].cont] + '<div class="minis"></div>';
  var t = $('#minisTop'); t.innerHTML = '';
  S.got.forEach(function (it) {
    var d = document.createElement('div'); d.className = 'mini'; d.innerHTML = it.art; c.querySelector('.minis').appendChild(d);
    var e = document.createElement('div'); e.className = 'mini'; e.innerHTML = it.art; t.appendChild(e);
  });
}
function confetti() {
  var box = $('#confetti'); box.innerHTML = '';
  var cols = ['#FF6B6B', '#FFD43B', '#4D96FF', '#35D07F', '#FF8FD6', '#fff'];
  for (var i = 0; i < 36; i++) {
    var d = document.createElement('i');
    d.style.left = (Math.random() * 1260) + 'px'; d.style.background = cols[i % cols.length];
    d.style.animationDelay = (Math.random() * 0.8) + 's'; d.style.animationDuration = (1.8 + Math.random() * 1.4) + 's';
    box.appendChild(d);
  }
  setTimeout(function () { box.innerHTML = ''; }, 4400);
}

/* ---------- ink ---------- */
function clearInk() { inkX.clearRect(0, 0, 1280, 640); liveX.clearRect(0, 0, 1280, 640); inkC.style.transition = 'none'; inkC.style.opacity = 1; }
function clearInkSoon() { setTimeout(function () { if (!drawing) clearInk(); }, 250); }
function fadeInk() {
  inkC.style.transition = 'opacity .45s'; inkC.style.opacity = 0;
  setTimeout(function () { if (!drawing) { inkX.clearRect(0, 0, 1280, 640); } inkC.style.transition = 'none'; inkC.style.opacity = 1; }, 520);
}
function drawStroke(c, pts, st) {
  if (!pts.length) return;
  c.lineCap = 'round'; c.lineJoin = 'round';
  var i;
  if (st.rainbow) {
    c.globalAlpha = 1; c.lineWidth = 22;
    if (pts.length === 1) pts = [pts[0], [pts[0][0] + 0.01, pts[0][1]]];
    for (i = 1; i < pts.length; i++) {
      c.strokeStyle = 'hsl(' + ((i * 9) % 360) + ',90%,60%)';
      c.beginPath(); c.moveTo(pts[i - 1][0], pts[i - 1][1]); c.lineTo(pts[i][0], pts[i][1]); c.stroke();
    }
    return;
  }
  function path() {
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    if (pts.length === 1) c.lineTo(pts[0][0] + 0.01, pts[0][1]);
    for (var k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);
  }
  c.globalAlpha = 0.28; c.strokeStyle = st.color; c.lineWidth = 42; path(); c.stroke();
  c.globalAlpha = 0.5; c.lineWidth = 26; path(); c.stroke();
  c.globalAlpha = 1; c.strokeStyle = st.core || '#FFFDF0'; c.lineWidth = 12; path(); c.stroke();
}
var drawing = null, raf = 0;
function toStagePt(e) { return [(e.clientX - offX) / scale, (e.clientY - offY) / scale]; }
function requestDraw() {
  if (raf) return;
  raf = requestAnimationFrame(function () { raf = 0; if (!drawing) return; liveX.clearRect(0, 0, 1280, 640); drawStroke(liveX, drawing.pts, inkStyle); });
}
stage.addEventListener('pointerdown', function (e) {
  if (S.mode !== 'write' && S.mode !== 'draw') return;
  if (S.mode === 'write' && S.locked) return;
  if (e.target.closest && e.target.closest('.btn,.sw')) return;
  if (drawing) return;
  inkC.style.transition = 'none'; inkC.style.opacity = 1;
  drawing = { id: e.pointerId, pts: [toStagePt(e)], len: 0 };
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  requestDraw(); e.preventDefault();
});
stage.addEventListener('pointermove', function (e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  if (!evs.length) evs = [e];
  for (var i = 0; i < evs.length; i++) {
    var p = toStagePt(evs[i]), last = drawing.pts[drawing.pts.length - 1], d = Math.hypot(p[0] - last[0], p[1] - last[1]);
    if (d < 1.5) continue;
    drawing.len += d; drawing.pts.push(p);
  }
  requestDraw();
});
function lift(e) {
  if (!drawing || e.pointerId !== drawing.id) return;
  var d = drawing; drawing = null;
  drawStroke(inkX, d.pts, inkStyle); liveX.clearRect(0, 0, 1280, 640);
  if (S.mode === 'write') handleLift(d);
}
stage.addEventListener('pointerup', lift);
stage.addEventListener('pointercancel', lift);
stage.addEventListener('contextmenu', function (e) { e.preventDefault(); });

/* ---------- buttons ---------- */
function bind(id, fn) { $(id).addEventListener('click', function () { ac(); fn(); }); }
bind('#bBack', function () {
  sfx.pop(); cancelAnimationFrame(jugRAF); clearInk(); S.locked = false;
  var m = S.mode;
  if (m === 'place') setMode('welcome');
  else if (m === 'board') setMode('place');
  else if (m === 'write' || m === 'find') { buildBoard(); setMode('board'); }
  else if (m === 'draw') { setMode(S.lastMode); if (S.lastMode === 'write') { inkStyle = writeInk(); S.sdone = {}; S.fails = 0; renderWrite(); startRoundHint(); } }
});
bind('#bSkip', function () { if (S.mode === 'write' && !S.locked) { S.data.strokes.forEach(function (_, i) { S.sdone[i] = true; }); roundDone(); } });
bind('#bBrush', function () {
  sfx.pop(); S.lastMode = S.mode; $('#bBrush').classList.remove('offer'); S.missRow = 0; cancelAnimationFrame(jugRAF); clearInk(); inkStyle = { color: '#FFE066', core: '#FFFDF0' }; setMode('draw');
});
bind('#bClear', function () { sfx.pop(); clearInk(); });
bind('#bReplay', function () {
  sfx.pop(); S.count = 0; S.got = []; S.prog = {}; S.stars = { abc: {}, num: {}, urdu: {} }; renderCont(); setMode('welcome');
});
function buildPalette() {
  var p = $('#palette'); p.innerHTML = '';
  ['#FFE066', '#FF6B6B', '#4D96FF', '#35D07F', '#FF8FD6', '#FFFFFF', 'rainbow'].forEach(function (col) {
    var b = document.createElement('div'); b.className = 'sw' + (col === 'rainbow' ? ' rb' : '');
    if (col !== 'rainbow') b.style.background = col;
    b.addEventListener('click', function () { ac(); sfx.tick(); inkStyle = col === 'rainbow' ? { rainbow: true } : { color: col, core: '#FFFDF0' }; });
    p.appendChild(b);
  });
}

/* ---------- start ---------- */
$('#bBack').innerHTML = ICON.back; $('#bSkip').innerHTML = ICON.skip; $('#bBrush').innerHTML = ICON.crayon;
$('#bClear').innerHTML = ICON.eraser; $('#bReplay').innerHTML = ICON.replay;
$('#endPaper').innerHTML = ICON.paper + ICON.pencil; $('#moon').innerHTML = ICON.moon;
fit(); buildWelcome(); buildPlace(); buildPalette(); setMode('welcome');
S.ready = loadChars();
window.__mock = { S: S, setMode: setMode, toStage: toStage, U: U, TOP: TOP, ROOMS: ROOMS, ROUNDS: ROUNDS, stageOf: stageOf };
})();

</script>
