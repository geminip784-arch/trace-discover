<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The whole screen is writable. Jugnu floats on top and ignores touches;
       only the ear button takes taps. */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #area > svg, #area > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg, #jugnu { pointer-events: none; }
    #jugnu {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      -webkit-user-drag: none;
    }
  </style>
</head>
<body>
  <div id="area">
    <svg id="lines" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
    <svg id="fx" aria-hidden="true"></svg>
    <img id="jugnu" src="assets/jugnu.svg" alt="" draggable="false" hidden>
  </div>
  <script type="module">
    for (const type of ['contextmenu', 'selectstart', 'dragstart']) {
      document.addEventListener(type, (e) => {
        if (e.target.closest?.('textarea, input')) return; // the debug log box and the setup fields only
        e.preventDefault();
      });
    }

    // index.html?setup=1 is the parent setup page. Every other address is the game.
    if (new URLSearchParams(location.search).get('setup') === '1') {
      const { showSetup } = await import('./src/setup.js');
      showSetup();
    } else {
      const { startGame } = await import('./src/game.js');
      const params = new URLSearchParams(location.search);
      let manifest = [];
      try { manifest = await (await fetch('data/chars/index.json')).json(); } catch { /* none: nothing loads */ }
      startGame({
        area: document.getElementById('area'),
        lines: document.getElementById('lines'),
        ink: document.getElementById('ink'),
        fx: document.getElementById('fx'),
        jugnu: document.getElementById('jugnu'),
      }, { charId: params.get('char') || 'L', manifest, debugOn: params.get('debug') === '1' });
    }
  </script>
</body>
</html>
