<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The whole screen is writable. Jugnu and buttons will float on top (later slices). */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #area > svg, #area > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg { pointer-events: none; }
  </style>
</head>
<body>
  <div id="area">
    <svg id="lines" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
  </div>
  <script type="module">
    import { computeLayout, drawLines, drawTrack, letterOffset, createInk, toUnits } from './src/render.js';
    import { trackSinglePointer } from './src/input.js';
    import { scoreStroke } from './src/geometry.js';
    import { createDebugPanel } from './src/debug.js';

    const STAGE = 1;
    const area = document.getElementById('area');
    const svg = document.getElementById('lines');
    const ink = createInk(document.getElementById('ink'));
    const char = await (await fetch('data/chars/L.example.json')).json();
    const debug = new URLSearchParams(location.search).get('debug') === '1'
      ? createDebugPanel(char.strokes.length) : null;
    let layout;
    let offset;

    function applyLayout() {
      layout = computeLayout(window.innerWidth, window.innerHeight);
      offset = letterOffset(layout, char.width);
      drawLines(svg, layout);
      drawTrack(svg, layout, char, offset);
      ink.resize(layout);
    }

    // Her stroke in the character's own line units, as [x, y] for geometry.js.
    let stroke = [];
    let next = 0; // the reference stroke she must draw now
    const toChar = (u) => [u.x - offset, u.y];

    trackSinglePointer(area, {
      onStart: (p) => {
        const u = toUnits(p.x, p.y, layout);
        stroke = [toChar(u)];
        ink.begin(u);
      },
      onMove: (points) => {
        const us = points.map((p) => toUnits(p.x, p.y, layout));
        for (const u of us) stroke.push(toChar(u));
        ink.add(us);
      },
      onEnd: () => {
        ink.end();
        const index = next;
        const result = scoreStroke(stroke, char.strokes[index].points, STAGE);
        // Move on only when this stroke is ok; after the last one, start again at stroke 1.
        if (result.ok) next = (next + 1) % char.strokes.length;
        if (debug) debug.show(index, result, next);
      },
    });

    let resizePending = false;
    window.addEventListener('resize', () => {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(() => { resizePending = false; applyLayout(); });
    });

    for (const type of ['contextmenu', 'selectstart', 'dragstart']) {
      document.addEventListener(type, (e) => e.preventDefault());
    }

    applyLayout();
  </script>
</body>
</html>
