<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The whole screen is writable. Jugnu and buttons will float on top (later slices). */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #area > svg, #area > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg { pointer-events: none; }
  </style>
</head>
<body>
  <div id="area">
    <svg id="lines" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
  </div>
  <script type="module">
    import { computeLayout, drawLines, createInk, toUnits } from './src/render.js';
    import { trackSinglePointer } from './src/input.js';

    const area = document.getElementById('area');
    const svg = document.getElementById('lines');
    const ink = createInk(document.getElementById('ink'));
    let layout;

    function applyLayout() {
      layout = computeLayout(window.innerWidth, window.innerHeight);
      drawLines(svg, layout);
      ink.resize(layout);
    }

    trackSinglePointer(area, {
      onStart: (p) => ink.begin(toUnits(p.x, p.y, layout)),
      onMove: (points) => ink.add(points.map((p) => toUnits(p.x, p.y, layout))),
      onEnd: () => ink.end(),
    });

    let resizePending = false;
    window.addEventListener('resize', () => {
      if (resizePending) return;
      resizePending = true;
      requestAnimationFrame(() => { resizePending = false; applyLayout(); });
    });

    for (const type of ['contextmenu', 'selectstart', 'dragstart']) {
      document.addEventListener(type, (e) => e.preventDefault());
    }

    applyLayout();
  </script>
</body>
</html>
