<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover</title>
  <style>
    /* Served from assets/fonts/ only (licence: assets/fonts/OFL.txt). */
    @font-face {
      font-family: Fredoka;
      src: url('assets/fonts/fredoka-latin-600-normal.woff2') format('woff2');
      font-weight: 600;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      font-family: Fredoka, system-ui, sans-serif;
      font-weight: 600;
    }
    [hidden] { display: none !important; }
    img { -webkit-user-drag: none; }

    /* ---- writing: the whole screen is writable. Jugnu floats on top and
       ignores touches; only the home button takes taps. ---- */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
      background: #E6F4FF; /* light page round the white writing board */
    }
    #area > svg, #area > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg, #jugnu { pointer-events: none; }
    #jugnu {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
    }

    /* ---- the round lights, top right (mockup4): done, now, to come. They never take taps. ---- */
    #rounds {
      position: fixed;
      top: 20px;
      right: 28px;
      z-index: 20;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }
    #rounds .rl {
      box-sizing: border-box;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #EEF4FB;
      border: 5px solid #D6E6F5;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08);
      transition: background 0.3s, box-shadow 0.3s;
    }
    #rounds .rl.now { background: #fff; border-color: #35D07F; }
    #rounds .rl.done { background: #FFD43B; border-color: #fff; box-shadow: 0 0 18px #FFD43B, 0 4px 0 rgba(0, 0, 0, 0.12); }
    #rounds .rl.lit { animation: lightup 0.5s ease; }
    @keyframes lightup { 50% { transform: scale(1.3); } }
    /* ---- buttons: float on the left, 96 px ---- */
    .btn {
      position: fixed;
      left: 16px;
      z-index: 20;
      width: 96px;
      height: 96px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18);
      touch-action: none;
      cursor: pointer;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); }
    .btn svg { width: 60px; height: 60px; display: block; margin: auto; pointer-events: none; }
    #home { top: 16px; }
    #back { top: 128px; }
    #music { bottom: 16px; }
    #music.off { opacity: 0.75; }

    /* ---- the screens ---- */
    #shell { position: fixed; inset: 0; overflow: hidden; }
    .view { position: absolute; inset: 0; overflow: hidden; animation: view-in 0.35s ease-out both; }
    @keyframes view-in { from { opacity: 0; } to { opacity: 1; } }
    .buddy { position: absolute; pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 224, 102, 0.9)); animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-12px); } }
    [role=button] { cursor: pointer; }

    /* The front door: the house covers the screen (2 : 1, centered). */
    .view-door { background: #BFE6FF; }
    .house {
      position: absolute;
      left: 50%;
      top: 50%;
      width: max(100vw, 200vh);
      height: calc(max(100vw, 200vh) / 2);
      transform: translate(-50%, -50%);
    }
    .house > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    /* The doorway in the picture: x 580, y 360, 120 x 204 of 1280 x 640. */
    .door {
      position: absolute;
      left: 45.3125%;
      top: 56.25%;
      width: 9.375%;
      height: 31.875%;
      transform-origin: 0 50%;
      transition: transform 1s ease;
      touch-action: none;
    }
    .door svg { width: 100%; height: 100%; display: block; }
    .door.ready { animation: door-pulse 1.4s ease-in-out infinite; }
    @keyframes door-pulse { 50% { filter: drop-shadow(0 0 22px #FFD43B); transform: scale(1.03); } }
    .door.open { transform: perspective(900px) rotateY(-78deg); animation: none; }
    .by-door { left: 56%; top: 57%; width: 9%; animation-name: bob, glow; animation-duration: 2.6s, 1.4s; animation-iteration-count: infinite; }
    @keyframes glow { 50% { filter: drop-shadow(0 0 26px #FFE066) brightness(1.15); } }

    /* The bookshelf: seven books face-out on a wooden shelf against a warm wall. */
    .view-shelf {
      background-color: #FDE9C9;
      background-image: radial-gradient(rgba(214, 150, 80, 0.16) 7px, transparent 8px);
      background-size: 64px 64px;
    }
    .over-shelf { left: calc(50% - 60px); top: 6%; width: 120px; }
    .shelf { position: absolute; left: 136px; right: 24px; bottom: 16%; }
    .books {
      --w: clamp(88px, calc((100vw - 160px - 6 * 16px) / 7), 150px);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      position: relative;
      z-index: 1;
    }
    .plank {
      height: 26px;
      margin: 0 -8px;
      border-radius: 6px;
      background: linear-gradient(#C98E55, #A9723F);
      box-shadow: 0 10px 0 #8A5A2E, 0 18px 18px rgba(0, 0, 0, 0.18);
    }
    .book {
      position: relative;
      width: var(--w);
      height: calc(var(--w) * 200 / 140);
      perspective: 900px;
      touch-action: none;
      transition: transform 0.4s ease, opacity 0.4s ease;
    }
    .book .cover, .book .pages { position: absolute; inset: 0; border-radius: 8px; }
    .book .cover { transform-origin: 0 50%; transition: transform 0.6s ease-in; filter: drop-shadow(0 6px 4px rgba(0, 0, 0, 0.2)); }
    .book .cover svg { width: 100%; height: 100%; display: block; }
    .book .pages { background: repeating-linear-gradient(#fff 0 10px, #F1E9DA 10px 12px); opacity: 0; }
    .book.locked { opacity: 0.45; }
    .book.wiggle { animation: wiggle 0.6s ease; }
    @keyframes wiggle { 25% { transform: rotate(-6deg); } 50% { transform: rotate(5deg); } 75% { transform: rotate(-3deg); } }
    .book.opening { transform: translateY(-14px) scale(1.12); z-index: 2; }
    .book.opening .pages { opacity: 1; }
    .book.opening .cover { transform: rotateY(-150deg); }
    .book-open .book:not(.opening), .book-open .over-shelf { opacity: 0.25; }

    /* A letter board: a cream board in a peach frame on a soft sky blue. */
    .view-board { background: #CFE9FB; }
    .at-left { left: 20px; top: calc(50% - 44px); width: 88px; }
    .board {
      position: absolute;
      left: 136px;  /* BOARD_BOX in src/session.js */
      right: 24px;
      top: 24px;
      bottom: 24px;
      box-sizing: border-box;
      border: 14px solid #FFC9A3;
      padding: 16px;
      border-radius: 32px;
      background: #FFF8E7;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tiles { display: grid; grid-template-columns: repeat(var(--cols, 7), var(--size, 100px)); grid-auto-rows: var(--size, 100px); gap: var(--gap, 12px); }
    .tile {
      position: relative;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22%;
      background: #fff;
      border: 5px solid var(--c);
      color: var(--c);
      line-height: 1;
      touch-action: none;
    }
    .script-latin .tile { font-size: calc(var(--size, 100px) * 0.6); }
    .script-urdu .tile { font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', serif; font-weight: 700; font-size: calc(var(--size, 100px) * 0.5); }
    .script-urdu .glyph { padding-bottom: 0.1em; }
    .tile.bright { box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12); }
    .tile.faint { opacity: 0.3; box-shadow: none; }
    .tile.picked { animation: pick 0.22s ease-out; }
    @keyframes pick { 50% { transform: scale(1.12); } }
    .tile.shake { animation: shake 0.4s; }
    @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
    .star { position: absolute; top: -10px; right: -10px; width: 38%; height: 38%; pointer-events: none; }
    [dir=rtl] .star { right: auto; left: -10px; }
    .star svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 6px rgba(255, 194, 26, 0.8)); }
    .star.new { animation: star-in 0.8s cubic-bezier(0.3, 1.6, 0.5, 1) 0.3s both; }
    @keyframes star-in { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }

    /* The games book: a warm glow behind its tiles. */
    .view-games { background: radial-gradient(circle at 50% 45%, #FFE0B2, #FFB74D); }

    /* ---- Slice 5C: the find and count scenes. The room covers the screen,
       Jugnu stays on the left, and only objects, groups and items take taps. ---- */
    .view-find { background: #FFF7E8; touch-action: none; }
    .sc-stage { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; }
    .sc-backdrop { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
    .sc-obj, .sc-group { position: absolute; transform-origin: 50% 100%; touch-action: none; cursor: pointer; }
    .sc-obj svg, .sc-group svg, .sc-ghost svg, .sc-mini svg { display: block; width: 100%; height: auto; overflow: visible; }
    .sc-obj svg, .sc-group svg { pointer-events: none; }
    .sc-obj.found { z-index: 2; pointer-events: none; filter: drop-shadow(0 0 12px #FFE066) drop-shadow(0 0 26px #FFD43B); }
    .sc-obj.gone, .sc-group.gone { opacity: 0; pointer-events: none; transition: opacity 0.4s; }
    .wig { animation: wiggle 0.6s ease; }
    .sc-word {
      position: absolute; left: 50%; top: 100%; margin-top: 4px; transform: translateX(-50%);
      padding: 0 18px 4px; border-radius: 28px; background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 5px 0 rgba(0, 0, 0, 0.08); color: #2A2370; font-size: 38px; line-height: 1.25;
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.25s;
    }
    .sc-word.above { top: auto; bottom: 100%; margin: 0 0 6px; }
    .sc-word.show { opacity: 1; }
    .sc-dots { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 14px; pointer-events: none; }
    .sc-dots i { box-sizing: border-box; width: 48px; height: 48px; border-radius: 50%; background: #EEF4FB; border: 5px solid #D6E6F5; box-shadow: 0 4px 0 rgba(0, 0, 0, 0.08); }
    .sc-dots i.on { background: #FFD43B; border-color: #fff; box-shadow: 0 0 18px #FFD43B, 0 4px 0 rgba(0, 0, 0, 0.12); animation: lightup 0.5s ease; }
    .sc-basket { position: absolute; right: 24px; top: 12px; z-index: 5; width: 140px; height: 140px; pointer-events: none; transform-origin: 50% 100%; }
    .sc-basket > svg { position: relative; display: block; width: 140px; height: 140px; }
    /* found objects sit in the basket: drawn first, so its front covers their lower half */
    .sc-minis { position: absolute; left: -10px; right: -10px; top: 18px; display: flex; justify-content: center; align-items: flex-end; gap: 0; }
    .sc-mini { width: 56px; }
    .sc-ghost { position: absolute; z-index: 6; pointer-events: none; transition: left 0.7s cubic-bezier(.3,.9,.3,1), top 0.7s cubic-bezier(.3,.9,.3,1), width 0.7s cubic-bezier(.3,.9,.3,1); }
    .sc-done .sc-basket, .sc-done .sc-dots { filter: drop-shadow(0 0 16px #FFD43B); }
    .sc-done .buddy { animation-name: bob, glow; animation-duration: 2.6s, 1.4s; animation-iteration-count: infinite; }
    .view-find .buddy { z-index: 7; }
    .sc-veil { position: absolute; inset: 0; z-index: 5; background: rgba(255, 255, 255, 0.55); pointer-events: none; animation: view-in 0.6s ease-out both; }
    .sc-group.sc-counting { z-index: 6; cursor: default; transition: left 0.8s cubic-bezier(.3,.9,.3,1), top 0.8s cubic-bezier(.3,.9,.3,1), width 0.8s cubic-bezier(.3,.9,.3,1); }
    .sc-counting.ready .cnt { pointer-events: auto; cursor: pointer; }
    .sc-counting .cnt { transform-box: fill-box; transform-origin: center; }
    .sc-counting.ready .cnt:not(.counted) { animation: breathe 1.1s ease-in-out infinite; }
    .sc-counting .counted { animation: countpop 0.35s ease; }
    .art .counted .num { opacity: 1; }
    .art .cnt.gold { filter: sepia(1) saturate(5) hue-rotate(5deg) brightness(1.15) drop-shadow(0 0 6px #FFD43B); }
    @keyframes breathe { 50% { transform: scale(1.07); } }
    @keyframes countpop { 50% { transform: scale(1.25) translateY(-8px); } }
    .sc-counting.cheer { animation: cheer 0.6s ease 2; }
    @keyframes cheer { 50% { transform: translateY(-24px) scale(1.04); } }
    .sc-count-word {
      position: absolute; z-index: 6; transform: translateX(-50%); padding: 0 28px 6px; border-radius: 40px;
      background: rgba(255, 255, 255, 0.94); box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08); color: #2A2370;
      font-size: 60px; line-height: 1.2; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.3s;
    }
    .sc-count-word.show { opacity: 1; }
    /* mockup4's little reward each object plays when she finds it */
    .art .glow { transition: opacity .6s; transform-box: fill-box; transform-origin: center; }
    .sc-obj.rw-lamp .glow { opacity: 1 !important; animation: rw-pulse 1.3s ease-in-out infinite; }
    @keyframes rw-pulse { 50% { transform: scale(1.12); } }
    @keyframes rw-spin { to { transform: rotate(360deg); } }
    .sc-obj.rw-fan .blades { animation: rw-spin .55s linear infinite; }
    @keyframes rw-rub { from { transform: translateX(-14px) rotate(-4deg); } to { transform: translateX(14px) rotate(4deg); } }
    .sc-obj.rw-eraser .wob { animation: rw-rub .45s ease-in-out infinite alternate; }
    .art .pop { opacity: 0; }
    .sc-obj.rw-lunch .lid { animation: rw-openlid 1.2s ease forwards; }
    @keyframes rw-openlid { to { transform: rotate(-56deg); } }
    .sc-obj.rw-lunch .pop { animation: rw-popup 1.6s .7s ease forwards; }
    @keyframes rw-popup { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(-58px); opacity: 1; } }
    .sc-obj.rw-flag .cloth { animation: rw-flutter .5s ease-in-out infinite alternate; }
    @keyframes rw-flutter { from { transform: skewY(-7deg); } to { transform: skewY(7deg); } }
    .sc-obj.rw-egg .egg { animation: rw-wobble .5s ease-in-out infinite alternate; }
    @keyframes rw-wobble { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
    .sc-obj.rw-hat .swing { animation: rw-swing .8s ease-in-out infinite alternate; }
    @keyframes rw-swing { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
    .sc-obj.rw-heart .beat { animation: rw-beat .7s ease-in-out infinite; }
    @keyframes rw-beat { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.14); } }
    .sc-obj.rw-ink .bottle { animation: rw-rub .5s ease-in-out infinite alternate; }
    .sc-obj.rw-ink .drop { animation: rw-dropfall 1.1s ease-in infinite; }
    @keyframes rw-dropfall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(120px); opacity: 0; } }
    .sc-obj.rw-insect .bug { animation: rw-crawl .6s ease-in-out infinite alternate; }
    @keyframes rw-crawl { from { transform: translateX(-12px) rotate(-6deg); } to { transform: translateX(12px) rotate(6deg); } }
    .sc-obj.rw-toys .tb1 { animation: rw-hop2 .8s ease-in-out infinite; }
    .sc-obj.rw-toys .tb2 { animation: rw-hop2 .8s .2s ease-in-out infinite; }
    .sc-obj.rw-toys .tcar { animation: rw-drive 1s ease-in-out infinite alternate; }
    @keyframes rw-hop2 { 50% { transform: translateY(-16px); } }
    @keyframes rw-drive { from { transform: translateX(-12px); } to { transform: translateX(4px); } }
    .sc-obj.rw-tiger .tilt { animation: rw-tilt .7s ease-in-out infinite alternate; }
    @keyframes rw-tilt { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
    .sc-obj.rw-fork .fk { animation: rw-wobble .4s ease-in-out infinite alternate; }
    .sc-obj.rw-honey .jar { animation: rw-wobble .6s ease-in-out infinite alternate; }
    .sc-obj.rw-honey .drip { animation: rw-dropfall 1.1s ease-in infinite; }
    .sc-obj.rw-ice .scoop2 { animation: rw-popin .5s .3s ease both; }
    .sc-obj.rw-ice .cherry { animation: rw-cherryup .5s .3s ease both; }
    @keyframes rw-popin { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rw-cherryup { to { transform: translateY(-44px); } }
    .sc-obj.rw-lemon .lem { animation: rw-wobble .45s ease-in-out infinite alternate; }
    .sc-obj.rw-lemon .drops { opacity: 1; animation: rw-rise 1.4s ease-out infinite; }
    .sc-obj.rw-tomato .tom { animation: rw-hop2 .6s ease-in-out infinite; }
    /* Slice 5G pictures: each moves its <g class="anim"> one of three ways. */
    .sc-obj.rw-hop .anim { animation: rw-hop2 .7s ease-in-out infinite; }
    .sc-obj.rw-wobble .anim { animation: rw-wobble .5s ease-in-out infinite alternate; }
    .sc-obj.rw-swing .anim { animation: rw-swing .8s ease-in-out infinite alternate; }
    .art .num { opacity: 0; }
    .art .steam, .art .scoop2, .art .drops { opacity: 0; }
    @keyframes rw-rise { from { transform: translateY(60px); opacity: 0; } 30% { opacity: .75; } to { transform: translateY(-80px); opacity: 0; } }

    /* ---- her shelf of finds (mockup4): planks, the newest 24, a tap wiggles one ---- */
    .toybox-btn { position: absolute; left: 16px; top: 16px; width: 96px; height: 96px; padding: 6px; box-sizing: border-box; border-radius: 50%; background: #fff; box-shadow: 0 7px 0 rgba(0, 0, 0, 0.18); touch-action: none; cursor: pointer; z-index: 3; }
    .toybox-btn:active { transform: translateY(4px); box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); }
    .toybox-btn svg { width: 100%; height: 100%; display: block; pointer-events: none; }
    .view-toys {
      background-color: #FDE9C9;
      background-image: radial-gradient(rgba(214, 150, 80, 0.16) 7px, transparent 8px);
      background-size: 64px 64px;
    }
    .finds { position: absolute; left: 136px; right: 24px; top: 24px; bottom: 24px; display: flex; flex-direction: column; justify-content: space-evenly; }
    .finds-row { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; align-items: end; padding: 0 8px; }
    .finds-row::after { content: ''; position: absolute; left: 0; right: 0; bottom: -22px; height: 22px; border-radius: 6px; background: linear-gradient(#C98E55, #A9723F); box-shadow: 0 8px 0 #8A5A2E; }
    .find { display: flex; align-items: flex-end; justify-content: center; height: var(--row, 130px); touch-action: none; cursor: pointer; transform-origin: 50% 100%; }
    .find svg { display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .find.wide { grid-column: span 2; }

    /* ---- Slices 5D and 5F: the games book. A two-step menu: one row of big
       tiles per step (a tile per kind of game, then that kind's sets). ---- */
    .view-games, .view-play { touch-action: none; }
    .gm-menu {
      --n: 5;
      position: absolute; left: 136px; right: 24px; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center; gap: 28px;
    }
    .gm-tile.locked { opacity: 0.35; box-shadow: none; }
    .gm-tile {
      /* src/games.js menuTileSize: min(200, (width - 160 - (n - 1) x 28) / n, height - 120) */
      --t: min(200px, calc((100vw - 160px - (var(--n) - 1) * 28px) / var(--n)), calc(100vh - 120px));
      position: relative; flex: none; box-sizing: border-box; width: var(--t); height: var(--t); padding: 16px;
      display: flex; align-items: center; justify-content: center;
      background: #fff; border: 8px solid var(--c); border-radius: 32px;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.12); touch-action: none; cursor: pointer;
    }
    /* Step 1: a tiny gold star for each finished set of that kind, under the picture. */
    .gm-stars {
      position: absolute; left: 0; right: 0; bottom: -18px; display: flex; justify-content: center; gap: 2px;
      pointer-events: none;
    }
    .gm-stars svg { width: 30px; height: 30px; display: block; filter: drop-shadow(0 0 4px rgba(255, 194, 26, 0.8)); }
    .gm-tile > svg { width: 100%; height: auto; display: block; overflow: visible; pointer-events: none; }
    .gm-tile.picked { animation: pick 0.22s ease-out; }

    /* A game's board: 1280 x 640 units, scaled to fit right of the buttons (src/games.js boardFit). */
    .view-play { background: #CFE9FB; }
    .gm-board { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; transform-origin: 0 0; touch-action: none; overscroll-behavior: none; border-radius: 40px; background: #FFF8E7; box-shadow: inset 0 0 0 12px #FFC9A3; }
    .gm-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; }
    .gm-cards { position: absolute; inset: 0; pointer-events: none; }
    .gm-card {
      position: absolute; box-sizing: border-box; padding: 12px; display: flex; align-items: center; justify-content: center;
      background: #fff; border: 6px solid #D6E6F5; border-radius: 28px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
      transition: border-color 0.2s, box-shadow 0.3s, transform 0.15s;
    }
    .gm-card > svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .gm-card.gm-right.gm-numbers { padding: 6px 10px; }
    .gm-digit { font-size: 104px; line-height: 1; }
    .gm-card.gm-lift { transform: scale(1.05); border-color: #4D6BFF; }
    .gm-card.gm-matched { border-color: #FFD43B; box-shadow: 0 0 22px rgba(255, 212, 59, 0.8), 0 6px 0 rgba(0, 0, 0, 0.08); }
    .gm-live { fill: none; stroke: #4D6BFF; stroke-width: 16; stroke-linecap: round; opacity: 0.85; }
    .gm-halo { fill: none; stroke: #FFD43B; stroke-width: 36; stroke-linecap: round; opacity: 0.45; }
    .gm-core { fill: none; stroke: #FFC21A; stroke-width: 12; stroke-linecap: round; }
    .gm-fading { animation: gm-fade 0.45s ease forwards; }
    @keyframes gm-fade { to { opacity: 0; } }
    .gm-sparkle { position: absolute; z-index: 3; width: 90px; height: 90px; pointer-events: none; animation: gm-sparkle 0.9s ease-out forwards; }
    .gm-sparkle svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 8px rgba(255, 194, 26, 0.9)); }
    @keyframes gm-sparkle { 0% { transform: scale(0.2) rotate(-40deg); opacity: 0; } 40% { transform: scale(1.25); opacity: 1; } 100% { transform: scale(1) rotate(10deg); opacity: 0; } }
    .gm-glow .gm-card, .gm-glow .gm-home, .gm-glow .gm-animal { animation: gm-glow 1.2s ease; }
    .gm-glow .gm-halo { opacity: 0.8; transition: opacity 0.4s; }
    @keyframes gm-glow { 50% { filter: drop-shadow(0 0 22px #FFD43B) brightness(1.08); transform: scale(1.05); } }

    /* Follow the path: a meadow, roads with an outline (the later road crosses over, like a bridge). */
    .view-play-path .gm-board { background: #C9EBB2; box-shadow: inset 0 0 0 12px #9ED58A; }
    .gm-road-edge, .gm-road-top, .gm-road-mid, .gm-trace, .gm-trail { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gm-road-edge { stroke: #B7814A; }
    .gm-road-top { stroke: #F2D9A8; transition: stroke 0.5s; }
    .gm-road-mid { stroke: #fff; stroke-width: 4; stroke-dasharray: 14 16; opacity: 0.8; }
    .gm-road.gm-done .gm-road-top { stroke: #FFE9A0; }
    .gm-trace { stroke: #FFD43B; stroke-width: 30; opacity: 0.9; filter: drop-shadow(0 0 8px #FFE066); }
    .gm-trail { stroke: #FFE066; stroke-width: 16; opacity: 0.8; }
    .gm-animal, .gm-home { position: absolute; transform-origin: 50% 100%; }
    .gm-animal { z-index: 4; touch-action: none; }
    .gm-home { z-index: 3; transition: filter 0.4s; }
    .gm-animal > svg, .gm-home > svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
    .gm-home.gm-lit { filter: drop-shadow(0 0 16px #FFD43B); }
    .gm-home.gm-room { box-sizing: border-box; border: 6px solid #fff; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12); transform-origin: 50% 50%; }
    .view-play-path-rooms .gm-board { background: #F3E3C3; box-shadow: inset 0 0 0 12px #E2C99A; }
    .gm-card.gm-right.gm-letters, .gm-card.gm-left.gm-shadows, .gm-card.gm-right.gm-shadows { padding: 6px; }
    .gm-jugnu { position: absolute; z-index: 5; pointer-events: none; filter: drop-shadow(0 0 14px rgba(255, 224, 102, 0.9)); }
    .view-play .buddy.away { opacity: 0; transition: opacity 0.3s; }

    /* Missing piece (Slice 5H): shapes with dashed holes along the top, the pieces on a shelf below. */
    .gm-board.mp-board { background: #FFF8E7; box-shadow: inset 0 0 0 12px #F7C6D9; }
    .mp-tray { fill: #FFEFD6; stroke: #F2DDB8; stroke-width: 4; }
    .mp-gap { stroke: #B9A88F; stroke-width: 3; stroke-dasharray: 8 7; stroke-linejoin: round; }
    .mp-wig, .mp-body { transform-box: fill-box; transform-origin: 50% 50%; }
    .mp-lift .mp-wig { filter: drop-shadow(0 8px 6px rgba(0, 0, 0, 0.22)); }
    .mp-body.mp-whole { animation: mp-glow 1s ease; }
    .gm-glow .mp-body { animation: mp-glow 1.2s ease; }
    @keyframes mp-glow { 50% { filter: drop-shadow(0 0 18px #FFD43B) brightness(1.08); } }

    /* Sort it: six things along the top, two baskets below, each with its sample on the front. */
    .gm-board.st-board { background: #EAF7E4; box-shadow: inset 0 0 0 12px #BFE3B0; }
    .st-basket, .st-thing { position: absolute; }
    .st-basket { z-index: 3; transform-origin: 50% 90%; }
    .st-thing { z-index: 4; touch-action: none; transition: filter 0.2s; }
    .st-basket > svg, .st-thing > svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
    .st-thing.st-lift { z-index: 6; filter: drop-shadow(0 10px 8px rgba(0, 0, 0, 0.18)); }
    .st-thing.st-in { pointer-events: none; z-index: 2; } /* in the basket: behind its front */
    .st-basket.st-take { animation: st-take 0.35s ease-out; }
    @keyframes st-take { 50% { transform: scale(1.04, 0.96); } }
    .gm-glow .st-basket, .gm-glow .st-thing { animation: gm-glow 1.2s ease; }

    /* Odd one out: four cards in a row; five dots along the top fill as the rows are done. */
    .gm-board.od-board { background: #FFF4F8; box-shadow: inset 0 0 0 12px #F8C9DA; }
    .od-card {
      position: absolute; box-sizing: border-box; padding: 16px; display: flex; align-items: center; justify-content: center;
      background: #fff; border: 6px solid #D6E6F5; border-radius: 32px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.08);
      touch-action: none; z-index: 3; transition: border-color 0.2s, box-shadow 0.3s, opacity 0.4s;
    }
    .od-card > svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
    .od-card.od-right { border-color: #FFD43B; box-shadow: 0 0 30px rgba(255, 212, 59, 0.9), 0 6px 0 rgba(0, 0, 0, 0.08); animation: od-pop 0.5s ease; }
    .od-card.od-rest { opacity: 0.55; }
    .od-card.od-tap { animation: od-pop 0.4s ease; }
    @keyframes od-pop { 50% { transform: scale(1.08); } }
    .od-dot { fill: #fff; stroke: #F8C9DA; stroke-width: 5; transition: fill 0.4s; }
    .od-dot.on { fill: #FFD43B; stroke: #FFC21A; }
    .gm-glow .od-card.od-right { animation: gm-glow 1.2s ease; }

    /* ---- Slice 5E: the Drawing book. The menu: free drawing, then a row per level. ---- */
    .view-drawing { background: radial-gradient(circle at 50% 40%, #E0F7F3, #A7DCD3); touch-action: none; }
    .view-dots, .view-paper { background: #CFE9FB; touch-action: none; }
    .dw-menu {
      --t: min(calc((100vw - 136px - 24px - 240px - 60px - 5 * 14px) / 6), calc((100vh - 60px) / 3 - 18px), 150px);
      position: absolute; left: 136px; right: 24px; top: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center; gap: 28px;
    }
    .dw-free {
      box-sizing: border-box; width: 220px; height: 260px; padding: 18px; flex: none;
      background: #fff; border: 10px solid #00897B; border-radius: 36px; box-shadow: 0 8px 0 rgba(0, 0, 0, 0.12);
      display: flex; align-items: center; justify-content: center; touch-action: none; cursor: pointer;
    }
    .dw-free > svg { width: 100%; height: auto; pointer-events: none; }
    .dw-levels { display: flex; flex-direction: column; gap: 18px; }
    .dw-level { display: flex; align-items: center; gap: 16px; }
    .dw-mark { width: 24px; flex: none; display: flex; justify-content: center; }
    .dw-mark svg { width: 24px; height: auto; display: block; }
    .dw-row { display: flex; gap: 14px; }
    .dw-tile {
      position: relative; box-sizing: border-box; width: var(--t); height: var(--t); padding: 10px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      background: #fff; border: 6px solid #B9E4DC; border-radius: 26px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.1);
      touch-action: none; cursor: pointer; transform-origin: 50% 100%;
    }
    .dw-tile.wide { width: calc(var(--t) * 1.5 + 7px); }
    .dw-tile > span:not(.star) { flex: 1; display: flex; pointer-events: none; }
    .dw-tile > span:not(.star) svg { width: 100%; height: auto; display: block; overflow: visible; }
    .dw-level.locked .dw-tile { opacity: 0.35; box-shadow: none; }
    .dw-level.locked .dw-mark { opacity: 0.35; }
    .dw-free.picked, .dw-tile.picked { animation: pick 0.22s ease-out; }

    /* A picture or the paper: the games' board (src/games.js), white like paper. */
    .gm-board.dw-board { background: #FFFFFF; box-shadow: inset 0 0 0 12px #D6E6F5; }
    .dw-paper { fill: #fff; stroke: #E3EEF8; stroke-width: 4; }
    .dw-ink path, .dw-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dw-canvas { position: absolute; left: 0; top: 0; width: 1280px; height: 640px; pointer-events: none; z-index: 3; }
    .gm-svg.dw-top { z-index: 3; }
    .dw-rainbow path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .dw-fading { animation: gm-fade 0.45s ease forwards; }
    .dw-dashed { fill: none; stroke: #B8C2CF; stroke-width: 4; stroke-dasharray: 14 12; stroke-linejoin: round; }
    .dw-dot-fill { fill: #2A2370; }
    .dw-dot-num { fill: #fff; font-family: Fredoka, sans-serif; font-weight: 600; font-size: 20px; text-anchor: middle; dominant-baseline: central; }
    .dw-dot-ring { fill: none; stroke: transparent; stroke-width: 6; }
    .dw-dot.at .dw-dot-ring { stroke: #FFD43B; opacity: 0.8; }
    .dw-dot.next .dw-dot-fill { fill: #35D07F; }
    .dw-dot.next .dw-dot-ring { stroke: #35D07F; transform-box: fill-box; transform-origin: center; animation: dw-pulse 1.1s ease-out infinite; }
    @keyframes dw-pulse { 0% { opacity: 0.9; transform: scale(0.7); } 100% { opacity: 0; transform: scale(1.5); } }
    .dw-fill { animation: dw-fill 1.1s ease both; }
    @keyframes dw-fill { from { opacity: 0; } to { opacity: 1; } }
    .dw-scene { opacity: 0; transition: opacity 0.8s; }
    .dw-scene.on { opacity: 1; }

    /* The crayon row: eight crayons, then the clear button or the big tick. */
    .dw-crayons { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
    .dw-crayon, .dw-button { position: absolute; touch-action: none; cursor: pointer; pointer-events: auto; }
    .dw-crayon { transition: transform 0.15s; transform-origin: 50% 100%; }
    .dw-crayon > svg, .dw-button > svg { width: 100%; height: 100%; display: block; overflow: visible; pointer-events: none; }
    .dw-crayon.on { transform: translateY(-14px) scale(1.06); filter: drop-shadow(0 0 10px rgba(255, 212, 59, 0.9)); }
    .dw-button:active { transform: scale(0.94); }
    .dw-button.holding { transform: scale(0.94); }
    .dw-button > svg.dw-ring { position: absolute; inset: -12px; width: calc(100% + 24px); height: calc(100% + 24px); transform: rotate(-90deg); }
    .dw-ring circle { fill: none; stroke: #FFD43B; stroke-width: 8; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 100; transform-box: view-box; transform-origin: center; transform: scale(0.92); }
    .dw-tick { animation: dw-tick 1.4s ease-in-out infinite; }
    @keyframes dw-tick { 50% { transform: scale(1.07); filter: drop-shadow(0 0 12px rgba(53, 208, 127, 0.7)); } }

    /* ---- landscape only: upright, this covers everything and takes every tap ---- */
    #turn {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #CFE9FB;
      touch-action: none;
    }
    #turn svg { width: min(92vw, 150vh); height: auto; display: block; overflow: visible; }
    #turn .turn-tab { transform-box: view-box; transform-origin: 300px 205px; animation: turn-tab 3.2s ease-in-out infinite; }
    @keyframes turn-tab {
      0%, 18% { transform: rotate(0); opacity: 1; }
      48%, 82% { transform: rotate(90deg); opacity: 1; }
      92% { transform: rotate(90deg); opacity: 0; }
      93% { transform: rotate(0); opacity: 0; }
      100% { transform: rotate(0); opacity: 1; }
    }
    #turn .turn-lines { transform-box: view-box; transform-origin: 300px 205px; animation: turn-lines 3.2s ease-in-out infinite; }
    @keyframes turn-lines {
      0%, 18% { transform: rotate(0); opacity: 0.3; }
      48%, 92% { transform: rotate(-90deg); opacity: 1; }
      93%, 100% { transform: rotate(0); opacity: 0.3; }
    }
    #turn .turn-arrow { animation: turn-arrow 3.2s ease-in-out infinite; }
    @keyframes turn-arrow { 0%, 12% { opacity: 0.35; } 30%, 50% { opacity: 1; } 70%, 100% { opacity: 0.35; } }
    #turn .turn-jugnu { transform-box: fill-box; transform-origin: center; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(255, 224, 102, 0.9)); }

    /* Portrait (not her setup, but keep it usable): the shelf uses the full width. */
    @media (max-width: 900px) {
      .shelf { left: 16px; right: 16px; }
      .books { --w: clamp(72px, calc((100vw - 32px - 6 * 8px) / 7), 150px); gap: 8px; }
    }
  </style>
</head>
<body>
  <div id="shell"></div>
  <div id="area" hidden>
    <svg id="lines" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
    <svg id="fx" aria-hidden="true"></svg>
    <img id="jugnu" src="assets/jugnu.svg" alt="" draggable="false" hidden>
  </div>
  <div id="rounds" aria-hidden="true" hidden></div>
  <button id="home" class="btn" type="button" aria-label="Home" hidden></button>
  <button id="back" class="btn" type="button" aria-label="Back" hidden></button>
  <button id="music" class="btn" type="button" aria-label="Music" hidden></button>
  <div id="turn" aria-hidden="true" hidden></div>
  <script type="module">
    for (const type of ['contextmenu', 'selectstart', 'dragstart']) {
      document.addEventListener(type, (e) => {
        if (e.target.closest?.('textarea, input')) return; // the debug log box and the setup fields only
        e.preventDefault();
      });
    }

    const params = new URLSearchParams(location.search);
    const $ = (id) => document.getElementById(id);
    // index.html?setup=1 is the parent setup page. Every other address is the app.
    if (params.get('setup') === '1') {
      for (const id of ['shell', 'home', 'back', 'music', 'rounds', 'turn']) $(id).remove();
      const { showSetup } = await import('./src/setup.js');
      showSetup();
    } else {
      // The recorded characters. Only these are ever requested.
      let manifest = [];
      try {
        const list = await (await fetch('data/chars/index.json')).json();
        if (Array.isArray(list)) manifest = list;
      } catch { /* none: every character stays faint */ }
      const { startShell } = await import('./src/screens.js');
      startShell({
        shell: $('shell'), area: $('area'), lines: $('lines'), ink: $('ink'), fx: $('fx'), jugnu: $('jugnu'), rounds: $('rounds'),
        home: $('home'), back: $('back'), music: $('music'), turn: $('turn'),
      }, { manifest, params });
    }
  </script>
</body>
</html>
