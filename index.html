<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The whole screen is writable. Jugnu floats on top and ignores touches;
       only the ear button takes taps. */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #area > svg, #area > canvas, #dimmer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg, #dimmer, #jugnu { pointer-events: none; }
    #jugnu {
      position: absolute;
      left: 0;
      top: 0;
      will-change: transform;
      -webkit-user-drag: none;
    }
    #jugnu.sleeping { filter: brightness(0.5) saturate(0.6); }
    #dimmer {
      background: rgba(5, 6, 20, 0.6);
      opacity: 0;
      transition: opacity 1.5s ease;
    }
    #dimmer.on { opacity: 1; }
    #ear {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 96px;
      height: 96px;
      padding: 0;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(255, 255, 255, 0.1);
      touch-action: none;
      z-index: 5;
    }
    #ear[hidden] { display: none; }
    #ear svg { width: 60px; height: 60px; display: block; margin: auto; }
  </style>
</head>
<body>
  <div id="area">
    <svg id="lines" aria-hidden="true"></svg>
    <canvas id="ink"></canvas>
    <svg id="fx" aria-hidden="true"></svg>
    <div id="dimmer"></div>
    <img id="jugnu" src="assets/jugnu.svg" alt="" draggable="false" hidden>
  </div>
  <button id="ear" type="button" aria-label="Say it again" hidden>
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M18 28 C18 14 28 6 38 6 C49 6 56 15 56 26 C56 36 48 40 45 47 C42 54 42 60 33 60 C27 60 24 56 23 52"
        fill="none" stroke="#ffe066" stroke-width="6" stroke-linecap="round"/>
      <path d="M30 28 C30 21 34 17 39 17 C45 17 47 22 46 27 C45 32 39 33 39 39"
        fill="none" stroke="#ffe066" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </button>
  <script type="module">
    import { startGame } from './src/game.js';

    for (const type of ['contextmenu', 'selectstart', 'dragstart']) {
      document.addEventListener(type, (e) => {
        if (e.target.closest?.('textarea')) return; // the debug log box only
        e.preventDefault();
      });
    }

    startGame({
      area: document.getElementById('area'),
      lines: document.getElementById('lines'),
      ink: document.getElementById('ink'),
      fx: document.getElementById('fx'),
      dimmer: document.getElementById('dimmer'),
      jugnu: document.getElementById('jugnu'),
      ear: document.getElementById('ear'),
    });
  </script>
</body>
</html>
