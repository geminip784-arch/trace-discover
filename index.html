<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Trace &amp; Discover — viewport check</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      color: #fff8d6;
      font-family: system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }
    main {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2vh;
      text-align: center;
    }
    .size { font-size: 14vh; font-weight: 700; line-height: 1; }
    .dpr  { font-size: 8vh; line-height: 1; }
    .hint { font-size: 4vh; opacity: 0.7; }
    .rotate { display: none; font-size: 5vh; color: #ffd24a; }
    @media (orientation: portrait) {
      .rotate { display: block; }
    }
  </style>
</head>
<body>
  <main>
    <div class="size"><span id="w">–</span> × <span id="h">–</span></div>
    <div class="dpr">devicePixelRatio <span id="dpr">–</span></div>
    <div class="hint">CSS px: width × height</div>
    <div class="rotate">Turn the tablet sideways (landscape)</div>
  </main>
  <script type="module">
    const w = document.getElementById('w');
    const h = document.getElementById('h');
    const dpr = document.getElementById('dpr');

    function show() {
      w.textContent = window.innerWidth;
      h.textContent = window.innerHeight;
      dpr.textContent = window.devicePixelRatio;
    }

    window.addEventListener('resize', show);
    window.addEventListener('orientationchange', show);
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    show();
  </script>
</body>
</html>
