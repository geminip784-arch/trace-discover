<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1f3a">
  <title>Stroke recorder</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #1b1f3a;
      color: #e8ecff;
      font: 15px/1.3 system-ui, sans-serif;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    /* The whole screen is writable, like index.html. Buttons float on top. */
    #area {
      position: fixed;
      inset: 0;
      touch-action: none;
    }
    #area > svg, #area > canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #area > svg { pointer-events: none; }

    /* Button bars take taps only on the buttons themselves. */
    .bar {
      position: fixed;
      left: 8px;
      right: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      pointer-events: none;
      z-index: 2;
    }
    #top { top: 8px; }
    #bottom { bottom: 8px; }
    .bar button, .bar .label { pointer-events: auto; }
    .bar .label { pointer-events: none; opacity: 0.7; margin-right: 4px; }
    #char-status { opacity: 1; background: rgba(16, 20, 42, 0.82); border-radius: 6px; padding: 4px 8px; }
    button {
      font: inherit;
      color: #e8ecff;
      background: #2c3260;
      border: 1px solid #4a5294;
      border-radius: 6px;
      padding: 6px 12px;
      min-height: 36px;
      touch-action: manipulation;
    }
    button:disabled { opacity: 0.4; }
    button.char { min-width: 52px; font-weight: 600; }
    button.current { background: #5bb8ff; border-color: #5bb8ff; color: #10142a; }
    button.on { background: #ffe85c; border-color: #ffe85c; color: #10142a; }
    button.unsaved { background: #4cc25a; border-color: #4cc25a; color: #10142a; }

    /* Pop-ups (discard question, export) cover the screen so nothing is drawn behind them. */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 12, 30, 0.75);
    }
    .overlay[hidden] { display: none; }
    .box {
      background: #262b52;
      border: 1px solid #4a5294;
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 90vw;
    }
    .box .row { display: flex; gap: 8px; justify-content: flex-end; }
    /* Character picker: one row per group. */
    #picker .box { max-height: 90vh; overflow-y: auto; }
    .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .group .name { width: 72px; opacity: 0.7; }
    .legend { display: flex; gap: 16px; flex-wrap: wrap; opacity: 0.85; font-size: 13px; }
    .legend span::before, .tile::after { font-size: 11px; }
    button.tile { min-width: 48px; min-height: 48px; font-weight: 700; font-size: 18px; position: relative; }
    button.tile.app { border-color: #5bb8ff; border-width: 2px; }
    button.tile.saved { background: #2f6b3a; border-color: #4cc25a; }
    button.tile.current { outline: 3px solid #ffe85c; outline-offset: 1px; }
    .key { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 2px solid #4a5294; background: #2c3260; }
    .key.app { border-color: #5bb8ff; }
    .key.saved { background: #2f6b3a; border-color: #4cc25a; }

    /* Stroke-order guide: top right, never takes taps. */
    #ref {
      position: fixed;
      top: 56px;
      right: 8px;
      width: 250px;
      z-index: 1;
      pointer-events: none;
      background: rgba(16, 20, 42, 0.82);
      border: 1px solid #4a5294;
      border-radius: 8px;
      padding: 8px;
      font-size: 12px;
      line-height: 1.3;
    }
    #ref svg { display: block; width: 100%; height: 120px; }
    #ref ol { margin: 6px 0 0; padding-left: 18px; }
    #ref li.done { opacity: 0.5; }
    #ref li.next { color: #ffe85c; }
    #ref .count, #ref .join { margin-top: 6px; }
    .warn { color: #ffb347; }
    .good { color: #6fe07c; }
    #warn-list { margin: 0; padding-left: 20px; }

    #export-text {
      width: 80vw;
      height: 55vh;
      font: 12px/1.35 monospace;
      color: #e8ecff;
      background: #10142a;
      border: 1px solid #4a5294;
      border-radius: 6px;
      -webkit-user-select: text;
      user-select: text;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }
  </style>
</head>
<body>
  <div id="area">
    <svg id="lines" aria-hidden="true"></svg>
    <svg id="marks" aria-hidden="true"></svg>
    <canvas id="live"></canvas>
  </div>

  <div class="bar" id="top">
    <button id="pick">Character: A</button>
    <span class="label" id="char-status"></span>
  </div>

  <div id="ref" aria-hidden="true"></div>

  <div class="bar" id="bottom">
    <button id="undo">Undo last stroke</button>
    <button id="clear">Clear character</button>
    <button id="straighten">Straighten</button>
    <button id="smooth">Smooth</button>
    <button id="dot">Next stroke is a dot</button>
    <button id="play">Play</button>
    <button id="direction">Direction: left to right</button>
    <button id="guide">Guide glyph: off</button>
    <button id="save">Save character</button>
    <button id="export">Export all</button>
  </div>

  <div class="overlay" id="discard" hidden>
    <div class="box">
      <div>Discard unsaved strokes?</div>
      <div class="row">
        <button id="discard-yes">Discard</button>
        <button id="discard-no">Keep</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="picker" hidden>
    <div class="box">
      <div id="picker-groups"></div>
      <div class="legend">
        <span><i class="key app"></i>in the app (data/chars/index.json)</span>
        <span><i class="key saved"></i>saved in this recorder</span>
        <span><i class="key"></i>not recorded</span>
      </div>
      <div class="row"><button id="picker-close">Close</button></div>
    </div>
  </div>

  <div class="overlay" id="warn" hidden>
    <div class="box">
      <div>These characters have a different number of strokes from the stroke-order guide:</div>
      <ul id="warn-list"></ul>
      <div class="row">
        <button id="warn-back">Go back</button>
        <button id="warn-export">Export anyway</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="export-box" hidden>
    <div class="box">
      <div id="export-status"></div>
      <textarea id="export-text" readonly spellcheck="false"></textarea>
      <div class="row">
        <button id="export-select">Select all</button>
        <button id="export-close">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="src/recorder.js"></script>
</body>
</html>
